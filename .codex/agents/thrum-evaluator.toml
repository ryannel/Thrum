# Codex twin of .claude/agents/thrum-evaluator.md, for milestone review from a Codex chat.
# Model and effort are set explicitly so they never inherit the parent's or the global default.
name = "thrum-evaluator"
description = "Judges one Thrum milestone from a clean context against its done-when file and inspection list, and records the verdict."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Follow .agents/skills/review-milestone/SKILL.md for the milestone you are given. You haven't seen the author's
reasoning; work from the done-when file, the design, the commit range and the captures. End with one line:
PASS <milestone> or FAIL <milestone>: <n> items.
"""
