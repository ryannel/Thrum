[package]
name = "i1-mobile-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bundled I1 game and native mobile entry proof"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[lints]
workspace = true

[dependencies]
thrum-core = { path = "../../crates/thrum-core" }
thrum-mobile-shell = { path = "../../crates/thrum-mobile-shell" }

[target.'cfg(target_os = "ios")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal"] }
pollster = "=1.0.1"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-game-activity"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan"] }
pollster = "=1.0.1"
