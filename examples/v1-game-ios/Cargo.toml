[package]
name = "v1-game-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "UIKit app entry and game adapter for the V1 game diagnostic"
autotests = false

[lib]
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[features]
proving = ["v1-game/proving", "dep:thrum-ui", "thrum-app/interface"]

[dependencies]
thrum-core = { path = "../../crates/thrum-core" }
v1-game = { path = "../v1-game", default-features = false }
pollster = "=1.0.1"
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }

[target.'cfg(target_os = "ios")'.dependencies]
thrum-app = { path = "../../crates/thrum-app" }
serde_json = "=1.0.154"
thrum-ui = { path = "../../crates/thrum-ui", optional = true }
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }

[dev-dependencies]
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }
thrum-test-support = { path = "../../crates/thrum-test-support" }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
