[package]
name = "link-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
allocation-proof = []

[[bench]]
name = "allocations"
harness = false
required-features = ["allocation-proof"]

[dev-dependencies]
divan = "=0.1.21"

[dependencies]
thrum-transport = { path = "../../crates/thrum-transport" }
serde_json = "=1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thrum-transport = { path = "../../crates/thrum-transport", features = ["native"] }
# The hostile peers, written below the engine's adapter. Every version is already locked for the adapter.
tokio = { version = "=1.54.1", features = ["rt", "net", "time"] }
web-transport-quinn = { version = "=0.13.6", default-features = false, features = ["ring"] }
url = "=2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
thrum-transport = { path = "../../crates/thrum-transport", features = ["browser"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "link-proof"
path = "src/main.rs"
test = false
