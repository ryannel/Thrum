<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thrum V1 WebGPU scene</title>
    <style>
      html, body { margin: 0; background: #101824; color: #e8eef8; font: 14px system-ui, sans-serif; }
      main { max-width: 1280px; margin: auto; padding: 1rem; }
      canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #101824; }
      output { display: block; margin-top: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
      .params { display: flex; gap: 1rem; align-items: start; margin-top: 1rem; }
      .params[hidden] { display: none; }
      #params-status, #material-status { white-space: pre-line; }
      .sky-presets { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; margin-top: 1rem; }
      button { border: 1px solid #6f86a3; border-radius: .3rem; background: #1a2b40; color: inherit; padding: .4rem .8rem; cursor: pointer; }
      button:disabled { opacity: .65; cursor: progress; }
      button:focus-visible, input:focus-visible { outline: 2px solid #a2cfff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="scene" width="1280" height="720" aria-label="Thrum V1 scene"></canvas>
      <section aria-label="Sky, camera and world controls">
        <!-- Built from the game's typed controls (thrum-controls), the same model as the macOS panel. -->
        <div id="demo-controls"></div>
        <div class="sky-presets">
          <button type="button" data-sky="sunrise">Sunrise</button>
          <button type="button" data-sky="noon">Noon</button>
          <button type="button" data-sky="sunset">Sunset</button>
          <button type="button" data-sky="twilight">Twilight</button>
          <button type="button" data-ground-preset="dawn-mist" hidden>Dawn mist</button>
          <button type="button" data-ground-preset="sea-fog" hidden>Sea fog</button>
          <button type="button" id="scene-view">Look at the scene</button>
          <button type="button" id="restore-graphics" hidden>Restore graphics</button>
        </div>
        <!-- ?params=<url>: a parameter file of control keys to display values (see params/). -->
        <div class="params" id="params" hidden>
          <button type="button" id="reload-params">Reload parameters</button>
          <output id="params-status"></output>
        </div>
        <!-- ?material=<url> with ?assets: a WGSL material hook for the cooked valley (see materials/). -->
        <div class="params" id="material" hidden>
          <button type="button" id="reload-material">Reload material</button>
          <output id="material-status"></output>
        </div>
      </section>
      <p>Move the local player with WASD or arrow keys. <span id="player"></span></p>
      <output id="status">Starting WebGPU…</output>
    </main>
    <script type="module">
      import init, { create_browser_game, fetch_cooked_valley } from "./v1_game.js";
      // @proving
      import { create_placed_browser_game, create_field_game, create_interface_game, create_interface_text_game, create_sprite_game, create_sprite_probe, create_cooked_sprite_game } from "./v1_game.js";
      // @end
      import { bindControls } from "./thrum-controls.js";
      import { mountPage } from "./host-page.js";

      const canvas = document.querySelector("#scene");
      const status = document.querySelector("#status");
      const player = document.querySelector("#player");
      try {
        await init();
        const probe = new URL(location.href).searchParams;
        const cooked = probe.has("assets");
        const exit = probe.get("scene") === "exit";
        const clouds = probe.get("clouds") ?? undefined;
        // @proving
        const interfaceScene = probe.get("scene") === "interface";
        const sprites = interfaceScene || probe.get("scene") === "sprites";
        const placed = probe.get("placed-clouds");
        const spriteSweep = sprites && probe.get("sprite-probe")?.startsWith("sweep:");
        if (spriteSweep) {
          canvas.style.width = "64px";
          canvas.style.height = "64px";
        }
        if ((sprites || exit || probe.has("field")) && clouds !== undefined && clouds !== "off") {
          throw new Error("Cloud selection requires the grid or cooked valley scene");
        }
        if (sprites) {
          for (const [key, feature] of [
            ["field", "the flythrough field"], ["meshes", "valley meshes"],
            ["field-meshes", "field meshes"], ["placed-clouds", "placed clouds"],
            ["diagnostic-clouds", "diagnostic clouds"], ["material", "a cooked material hook"],
          ]) {
            if (probe.has(key)) throw new Error(`2D scene refuses ${feature} (?${key})`);
          }
          if (probe.has("stars") && probe.get("stars") !== "off") {
            throw new Error("2D scene refuses valley stars (?stars)");
          }
          if (probe.has("backing")) {
            const [width, height] = probe.get("backing").split("x").map(Number);
            if (![width, height].every(side => Number.isInteger(side) && side > 0 && side <= 4096)) {
              throw new Error("Sprite backing size must be WIDTHxHEIGHT in 1..4096");
            }
            canvas.width = width;
            canvas.height = height;
          }
        }
        // The route comparison uses the canvas's authored backing size at the calibrated viewport.
        const fixedGrid = (sprites && probe.has("backing")) || (exit && probe.has("measure")) || probe.has("resize-probe") || probe.has("route-check");
        // @shipping
        const fixedGrid = false;
        // @end
        let backingDirty = true;
        let lastDpr;
        if (!fixedGrid) {
          new ResizeObserver(() => { backingDirty = true; }).observe(canvas);
        }
        const syncBackingSize = () => {
          const dpr = devicePixelRatio;
          if (fixedGrid || (!backingDirty && lastDpr === dpr)) return;
          lastDpr = dpr;
          backingDirty = false;
          const bounds = canvas.getBoundingClientRect();
          const width = Math.round(bounds.width * dpr);
          const height = Math.round(bounds.height * dpr);
          if (canvas.width !== width) canvas.width = width;
          if (canvas.height !== height) canvas.height = height;
        };
        if (exit && !cooked) throw new Error("The exit scene requires a cooked store");
        // @proving
        if (exit && probe.has("field")) throw new Error("The exit scene requires a cooked store");
        if (exit && probe.has("measure")) {
          canvas.width = 1920;
          canvas.height = 1080;
        }
        // @end
        syncBackingSize();
        // @proving
        const scale = Number(probe.get("scale") ?? 2);
        if (sprites && (!Number.isInteger(scale) || scale < 1 || scale > 6)) {
          throw new Error("Sprite scale must be an integer from 1 to 6");
        }
        const spriteRows = probe.has("rows") ? Number(probe.get("rows")) : undefined;
        if (sprites && spriteRows !== undefined && (!Number.isInteger(spriteRows) || spriteRows < 4 || spriteRows > 10000)) {
          throw new Error("Sprite row count must be a whole number in 4..10000");
        }
        if (sprites && probe.has("sprite-probe") &&
            (spriteRows !== undefined || probe.has("culling") || ![null, "off"].includes(probe.get("reconstruction")))) {
          throw new Error("Sprite sampling probes require the ordinary 2D path without a sprite field");
        }
        let spriteStore = null;
        const textCard = interfaceScene && probe.get("text-card");
        if ((sprites || textCard) && cooked) {
          if (probe.has("sprite-probe") || probe.has("culling") || ![null, "off"].includes(probe.get("reconstruction"))) {
            throw new Error("Cooked sheets require the moving sprite field");
          }
          status.textContent = "Fetching cooked sprite sheets…";
          spriteStore = await fetch_cooked_valley(probe.get("assets"));
        }
        if (textCard && !spriteStore) throw new Error("The text card requires a cooked font store");
        const interfaceScale = Math.min(3, Math.max(1, Math.round(devicePixelRatio)));
        const safeProbe = ["status", "menu"].includes(textCard) ? document.createElement("div") : null;
        if (safeProbe) {
          safeProbe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;" +
            "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
          document.body.append(safeProbe);
        }
        const interfaceOutput = () => {
          const css = getComputedStyle(safeProbe);
          const insets = [css.paddingLeft, css.paddingTop, css.paddingRight, css.paddingBottom].map(parseFloat);
          return { extent: [canvas.width, canvas.height], density: devicePixelRatio, insets };
        };
        if (safeProbe) window.thrumInterfaceOutput = interfaceOutput;
        const game = textCard
          ? await create_interface_text_game(canvas, spriteStore, interfaceScale, textCard, spriteRows ?? 10000)
          : spriteStore
          ? await create_cooked_sprite_game(canvas, spriteStore, spriteRows ?? 1000)
          : placed
          ? await create_placed_browser_game(canvas, placed)
          : interfaceScene
          ? await create_interface_game(canvas, interfaceScale, spriteRows ?? 10000, probe.has("paint-rows") ? Number(probe.get("paint-rows")) : undefined)
          : sprites
          ? probe.has("sprite-probe")
            ? await create_sprite_probe(canvas, probe.get("sprite-probe"))
            : await create_sprite_game(canvas, scale, spriteRows, probe.get("culling") ?? undefined, probe.get("reconstruction") ?? undefined)
          : probe.has("field")
          ? await create_field_game(canvas, probe.get("culling") ?? "default", probe.has("field-meshes"))
          : await create_browser_game(canvas, cooked && probe.get("stars") !== "off", probe.has("diagnostic-clouds"), false, probe.get("culling") ?? undefined, probe.get("meshes") === "on", probe.get("reconstruction") === "taau", cooked, exit, clouds, probe.get("rain") ?? undefined);
        // Arm the scene-linear checkpoint before the first animation frame.
        // Switching tap sources on a continuously driven game needs retirement.
        if (spriteSweep) {
          game.begin_linear_capture(1);
        }
        if (probe.has("extent-probe")) {
          window.thrumExtentReport = () => JSON.parse(game.route_report(0));
        }
        if (probe.has("diagnostic-clouds")) {
          const label = document.createElement("p");
          label.textContent = "Diagnostic cloud-shade stand-in, drifting at 160 m/s east and 40 m/s south.";
          canvas.after(label);
        }
        // @shipping
        const spriteStore = null;
        const game = await create_browser_game(canvas, cooked && probe.get("stars") !== "off", false, false, probe.get("culling") ?? undefined, probe.get("meshes") === "on", probe.get("reconstruction") === "taau", cooked, exit, clouds, probe.get("rain") ?? undefined);
        // @end
        // ?assets follows the cooker's publications for the selected scene.
        if (cooked) {
          let store = spriteStore;
          if (!store) {
            status.textContent = "Fetching the cooked valley…";
            store = await fetch_cooked_valley(probe.get("assets"));
            game.attach_cooked_valley(store);
          }
          // Follow later publications: each swaps in as it uploads.
          (async () => {
            for (;;) {
              try { await store.next_publication(); }
              catch (error) {
                console.warn(`Cooked publication poll failed: ${error}`);
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
          })();
        }
        // @proving
        if (exit && probe.has("governor")) {
          const mode = probe.get("governor");
          if (!["on", "off"].includes(mode)) throw new Error("The governor must be on or off");
          if (mode === "on" && !game.enable_route_governor()) {
            throw new Error("The prepared exit scene refused the governor");
          }
        }
        // @end
        // @proving
        const running = sprites ? "Running the sprite scene…" : probe.has("field") ? "Running the 100,513-instance field…" : "Running the 10,000-entity scene…";
        const pauseProbe = probe.has("pause-probe");
        const resizeProbe = probe.has("resize-probe");
        const overloadProbe = probe.has("overload-probe");
        const qualify = probe.has("qualify") || pauseProbe || resizeProbe || overloadProbe;
        // @shipping
        const running = "Running the 10,000-entity scene…";
        const qualify = false;
        // @end
        status.textContent = running;
        let exitReported = false;
        let stopped = false;
        // @proving
        const cloudCheck = (clouds || placed) && probe.has("cloud-check") ? globalThis.thrumCloudCheck : undefined;
        // @end
        const pressed = new Set();
        // Sliders, the pause toggle and the Sun readout come from the game's typed controls.
        // Edits go through the game's checked setters at once; pause takes the same path as
        // set_paused. These ids predate the model and the browser check drives them.
        const controls = bindControls(document.querySelector("#demo-controls"), game, {
          canEdit: () => !stopped,
          ids: { "sky.solar_time": "solar-time", "camera.yaw": "camera-yaw", "camera.pitch": "camera-pitch", "world.paused": "pause-world" },
          onError: (error) => { status.textContent = `Control fault: ${error}`; },
        });
        const look = (yaw, pitch) => {
          controls.set("camera.yaw", yaw);
          controls.set("camera.pitch", pitch);
        };
        const skies = { sunrise: [6.1, 90, 0], noon: [12, 0, 20], sunset: [17.9, -90, 0], twilight: [18.48, -90, 0] };
        document.querySelectorAll("[data-sky]").forEach((button) => button.addEventListener("click", () => {
          const [hours, yaw, pitch] = skies[button.dataset.sky];
          controls.set("sky.solar_time", hours);
          look(yaw, pitch);
        }));
        document.querySelector("#scene-view").addEventListener("click", () => look(0, 0));
        if (JSON.parse(game.controls_json()).controls.some(control => control.key === "clouds.radiative_day")) {
          for (const button of document.querySelectorAll("[data-ground-preset]")) {
            button.hidden = false;
            button.addEventListener("click", async () => {
              try {
                const response = await fetch(`clouds-${button.dataset.groundPreset}.params.json`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const report = JSON.parse(game.apply_parameters(await response.text(), performance.now()));
                if (report.problems.length) throw new Error(report.problems.join(", "));
                controls.refresh();
              } catch (error) {
                status.textContent = `Control fault: ${error}`;
              }
            });
          }
        }
        if (probe.has("params")) {
          // Applied through the same checked edits as the sliders; a bad file or entry is
          // explained here and never stops the frame loop.
          const source = new URL(probe.get("params"), location.href);
          const paramsStatus = document.querySelector("#params-status");
          const name = source.pathname.split("/").pop();
          const loadParams = async () => {
            try {
              const response = await fetch(source, { cache: "no-store" });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const report = JSON.parse(game.apply_parameters(await response.text(), performance.now()));
              controls.refresh();
              paramsStatus.textContent = [
                `${name}: ${report.changed} changed, ${report.unchanged} unchanged, ${report.problems.length} refused`,
                ...report.problems,
              ].join("\n");
            } catch (error) {
              paramsStatus.textContent = `${name}: ${error}; controls keep their values (fix the file and reload)`;
            }
          };
          document.querySelector("#params").hidden = false;
          document.querySelector("#reload-params").addEventListener("click", loadParams);
          await loadParams();
        }
        // Material reloads report through the frame loop: the current material draws until the
        // replacement compiles, and a refused hook is explained here with its file and line.
        // Only the development page (build.sh --dev) has the reload; the default page ignores
        // ?material and never fetches it.
        let pollMaterial = () => {};
        if (probe.has("material") && typeof game.reload_material === "function") {
          const source = new URL(probe.get("material"), location.href);
          const materialStatus = document.querySelector("#material-status");
          const name = source.pathname.split("/").pop();
          const loadMaterial = async () => {
            try {
              const response = await fetch(source, { cache: "no-store" });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const text = await response.text();
              const start = performance.now();
              const serial = game.reload_material(name, text);
              const call = (performance.now() - start).toFixed(2);
              materialStatus.textContent = `${name}: material ${serial} requested (page call ${call} ms); the current material draws until it compiles`;
            } catch (error) {
              materialStatus.textContent = `${name}: ${error}; the current material keeps drawing`;
            }
          };
          // A report arrives only when something changed. After a device is replaced the built-in
          // material draws until the accepted hook validates on the new device.
          let restoring = false;
          pollMaterial = () => {
            const report = game.material_report();
            if (!report) return;
            const next = JSON.parse(report);
            let line;
            if (next.restoring) line = `${next.accepted}: restoring the accepted material on the new device; the built-in material draws until it validates`;
            else if (restoring && next.accepted) line = `${next.accepted}: the accepted material draws again`;
            restoring = next.restoring;
            const lines = next.outcomes.map((outcome) => outcome.text);
            if (line) lines.push(line);
            if (next.outcomes.length) materialStatus.textContent = lines.join("\n");
            else if (line) materialStatus.textContent += `\n${line}`;
          };
          document.querySelector("#material").hidden = false;
          document.querySelector("#reload-material").addEventListener("click", loadMaterial);
          await loadMaterial();
        }
        let menuInput = null;
        // @proving
        if (textCard === "menu") {
          const { mountInterfaceInput } = await import("./interface-input.js");
          if (probe.has("menu-record")) game.record_menu_events();
          menuInput = mountInterfaceInput(canvas, {
            key: (...args) => game.menu_key(...args),
            pointer: (...args) => game.menu_pointer(...args),
            interrupt: (...args) => game.menu_interrupt(...args),
            text: (...args) => game.menu_text(...args),
          });
        }
        // @end
        const movementKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
        const updateControls = () => {
          const x = Number(pressed.has("KeyD") || pressed.has("ArrowRight"))
            - Number(pressed.has("KeyA") || pressed.has("ArrowLeft"));
          const y = Number(pressed.has("KeyW") || pressed.has("ArrowUp"))
            - Number(pressed.has("KeyS") || pressed.has("ArrowDown"));
          game.set_controls(x, y);
        };
        const clearControls = () => {
          if (menuInput) {
            menuInput.interrupt();
            return;
          }
          pressed.clear();
          updateControls();
        };
        window.addEventListener("keydown", (event) => {
          if (menuInput || !movementKeys.has(event.code) || stopped) return;
          if (event.target instanceof Element && event.target.closest("input, button")) return;
          event.preventDefault();
          if (pressed.has(event.code)) return;
          pressed.add(event.code);
          updateControls();
        });
        window.addEventListener("keyup", (event) => {
          if (menuInput || !movementKeys.has(event.code) || stopped) return;
          event.preventDefault();
          if (!pressed.has(event.code)) return;
          pressed.delete(event.code);
          updateControls();
        });
        window.addEventListener("blur", clearControls);
        document.addEventListener("focusin", (event) => {
          if (event.target instanceof Element && event.target.closest("input, button")) clearControls();
        });
        let lastPlayerUpdate = 0;
        // @proving
        let beforeCloudFrame;
        // @end
        const page = mountPage(game, {
          controlView: controls,
          recoveryButton: document.querySelector("#restore-graphics"),
          physicalKeys: false,
          // @proving
          canFrame: () => !spriteSweep && !cloudCheck?.hold,
          // @end
          onHidden: clearControls,
          beforeFrame() {
            syncBackingSize();
            if (exit) game.update_exit_profiler(qualify);
            // @proving
            if (safeProbe) {
              const { density, insets } = interfaceOutput();
              game.set_interface_output(density, ...insets);
            }
            beforeCloudFrame = cloudCheck?.enabled ? game.presented() : undefined;
            if (beforeCloudFrame !== undefined) game.observe_next_cloud_submission(cloudCheck.ground);
            // @end
          },
          onGraphics({ fault, recovering, error, unavailable, wasUnavailable }) {
            if (unavailable) {
              const progress = recovering ? "Restoring graphics… Simulation and controls remain available."
                : error ? `Restore failed: ${error}\nSimulation continues. You can retry Restore graphics.`
                : "Simulation continues. Choose Restore graphics to try again.";
              const message = fault ? `Graphics fault: ${fault}\n${progress}`
                : "Restoring graphics… Waiting for the first frame.\nSimulation and controls remain available.";
              if (status.textContent !== message) status.textContent = message;
            } else if (wasUnavailable) {
              status.textContent = running;
            }
          },
          // @proving
          async afterFrame(time, graphicsUnavailable) {
          // @shipping
          afterFrame(time) {
          // @end
            // @proving
            if (beforeCloudFrame !== undefined && game.presented() !== beforeCloudFrame) {
              const observation = game.inspect_cloud_submission();
              if (!observation) throw new Error("Submitted frame did not publish cloud products");
              cloudCheck.frames.push({presented: Number(game.presented()), callback_ms: time, ...JSON.parse(await observation)});
            }
            // @end
            pollMaterial();
            if (time - lastPlayerUpdate >= 500) {
              player.textContent = game.controlled_position();
              lastPlayerUpdate = time;
              if (exit && !qualify && !exitReported) {
                const rows = JSON.parse(game.exit_status());
                const rainy = ["shower", "soaked", "half-dry"].includes(probe.get("rain"));
                if (rows.row_generation && rows.active === 10000) {
                  status.textContent = rainy ? "Running the valley shower" : "Running 10,000 exit entities on cooked mesh rows";
                  exitReported = true;
                }
              }
            }
            // @proving
            if (!graphicsUnavailable && qualify && game.complete()) {
              status.textContent = game.report();
              stopped = true;
              page.stop();
            }
            // @end
          },
          onError(error, phase) {
            status.textContent = phase === "lifecycle" ? `Lifecycle fault: ${error}` : `Frame fault: ${error}; ${game.report()}`;
            stopped = true;
          },
        });
        // @proving
        if (cloudCheck) cloudCheck.resume = page.schedule;
        if (pauseProbe) {
          setTimeout(() => {
            if (stopped) return;
            page.setSuspended(true);
            if (stopped) return;
            status.textContent = "Paused for the two-second lifecycle probe…";
            setTimeout(() => {
              if (stopped) return;
              page.setSuspended(false);
              if (stopped) return;
              status.textContent = document.hidden
                ? "Lifecycle probe complete; waiting for visibility…"
                : running.replace("Running", "Resumed");
            }, 2000);
          }, 1000);
        }
        if (resizeProbe) {
          setTimeout(() => {
            if (stopped) return;
            canvas.width = 960;
            canvas.height = 540;
            status.textContent = "Reconfiguring the WebGPU canvas to 960 × 540…";
          }, 1000);
        }
        if (overloadProbe) {
          setTimeout(() => {
            if (stopped) return;
            page.cancelPending();
            status.textContent = "Delaying one visible animation callback by 250 ms…";
            setTimeout(() => {
              if (!stopped) page.schedule();
            }, 250);
          }, 1000);
        }
        // @end
      } catch (error) {
        status.textContent = `Startup fault: ${error}`;
      }
    </script>
  </body>
</html>
