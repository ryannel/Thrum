[package]
name = "v1-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thrum's external-consumer V1 test game"
default-run = "v1-game"

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
pollster = "=1.0.1"
thrum-core = { path = "../../crates/thrum-core" }
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "console"] }
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"
thrum-content-runtime = { path = "../../crates/thrum-content-runtime" }

[dev-dependencies]
divan = "=0.1.21"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "g2r"
harness = false
