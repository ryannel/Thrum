[package]
name = "v1-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thrum's external-consumer V1 test game"
default-run = "v1-game"

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[features]
draw-probe = ["thrum-asset-gpu/draw-probe"]
# The browser page's material hook reload (`?material=`), a development control that compiles
# shaders synchronously; only `web/build.sh --dev` enables it.
dev-material = []

[[test]]
name = "cooked_fault_gpu"
required-features = ["thrum-asset-gpu/fault-probe"]

[dependencies]
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }
thrum-controls = { path = "../../crates/thrum-controls" }
thrum-core = { path = "../../crates/thrum-core" }
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
thrum-app = { path = "../../crates/thrum-app" }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
thrum-app = { path = "../../crates/thrum-app" }
thrum-asset = { path = "../../crates/thrum-asset" }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thrum-content-runtime = { path = "../../crates/thrum-content-runtime" }

[dev-dependencies]
divan = "=0.1.21"
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
thrum-asset = { path = "../../crates/thrum-asset" }
thrum-cook = { path = "../../crates/thrum-cook" }

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "g2r"
harness = false

[[bench]]
name = "cooked_edit"
harness = false

[[bench]]
name = "material_reload"
harness = false

[[bench]]
name = "field_culling"
harness = false

[[bench]]
name = "valley_culling"
harness = false

[[bin]]
name = "cooked_draw_probe"
path = "src/bin/cooked_draw_probe.rs"
required-features = ["draw-probe"]
