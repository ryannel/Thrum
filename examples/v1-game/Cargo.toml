[package]
name = "v1-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thrum's external-consumer V1 test game"
default-run = "v1-game"
autotests = false

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[features]
default = ["proving"]
proving = ["dep:thrum-ui", "thrum-app/interface"]
creation-counters = ["thrum-app/creation-counters"]
draw-probe = ["proving", "thrum-asset-gpu/draw-probe", "thrum-render/creation-counters"]
# The browser page's material hook reload (`?material=`), a development control that compiles
# shaders synchronously; only `web/build.sh --dev` enables it.
dev-material = ["proving"]

# A target of its own: the main-tier list names it for its tests behind a feature; run by name from
# scripts/ray_tracing_proof.py.
[[test]]
name = "ray_tracing_gpu"

# A target of its own: the main-tier list names it for its long tests.
[[test]]
name = "field_occlusion_gpu"
path = "tests/support/field_occlusion_gpu.rs"

[dependencies]
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
thrum-fixtures = { path = "../../crates/thrum-fixtures" }
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }
thrum-asset = { path = "../../crates/thrum-asset" }
thrum-controls = { path = "../../crates/thrum-controls" }
thrum-core = { path = "../../crates/thrum-core" }
thrum-render = { path = "../../crates/thrum-render" }
thrum-ui = { path = "../../crates/thrum-ui", optional = true }
thrum-cloud-model = { path = "../../crates/thrum-cloud-model" }
thrum-clouds = { path = "../../crates/thrum-clouds" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
thrum-app = { path = "../../crates/thrum-app" }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
half = { version = "=2.7.1", default-features = false }
js-sys = "=0.3.106"
thrum-app = { path = "../../crates/thrum-app" }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement", "Performance", "Window", "console"] }

[dev-dependencies]
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu", features = ["fault-probe"] }
# The view-volume witnesses need counters when Cargo runs their named test targets.
thrum-render = { path = "../../crates/thrum-render", features = ["creation-counters"] }
bytemuck = "=1.25.2"
half = { version = "=2.7.1", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
sha2 = "=0.10.9"
thrum-test-support = { path = "../../crates/thrum-test-support", features = ["render"] }
thrum-cook = { path = "../../crates/thrum-cook", features = ["fault-probe"] }

[[bench]]
name = "cooked_edit"
harness = false
required-features = ["proving"]

[[bench]]
name = "valley_culling"
path = "tests/valley_route_support/bench.rs"
harness = false
required-features = ["proving"]

[[bench]]
name = "recipe_cost"
harness = false
required-features = ["draw-probe"]

[[bin]]
name = "cooked_draw_probe"
path = "src/bin/cooked_draw_probe.rs"
required-features = ["draw-probe"]
test = false

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "game_alone"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "view_volume_shadow_gpu"
path = "tests/view_volume/view_volume_shadow_gpu.rs"

[[test]]
name = "view_volume_sky_gpu"
path = "tests/view_volume/view_volume_sky_gpu.rs"

[[test]]
name = "view_volume_history_gpu"
path = "tests/view_volume/view_volume_history_gpu.rs"

[[test]]
name = "clouds_library"
path = "examples/cloud_library/proof.rs"

[[example]]
name = "cloud_cost"
required-features = ["proving"]

[[example]]
name = "atmosphere_cost"
required-features = ["proving"]

[[example]]
name = "exit_sweep"
required-features = ["proving"]

[[example]]
name = "cook_cloud_library"
path = "examples/cloud_library/main.rs"

# A target of its own: its check is named by open item CLOUDS M11.1.
[[test]]
name = "clouds_selection_gpu"
path = "tests/clouds_selection_gpu.rs"

# A target of its own: the main-tier list names it for its tests behind a feature; it holds tests
# behind a Cargo feature; run by name from tools/xtask/src/main.rs.
[[test]]
name = "cooked_assets_gpu"
path = "tests/cooked_assets_gpu.rs"

# A target of its own: the main-tier list names it for its long tests.
[[test]]
name = "exit_scene"
path = "tests/exit_scene.rs"

# A target of its own: its check is named by open item REVIEW-RENDER M5.1; it sets its binary's
# global allocator, so it runs apart.
[[test]]
name = "frame_alloc"
path = "tests/frame_alloc.rs"

# A target of its own: its check is named by open item DEAD-CODE M6.5; the main-tier list names it
# as not run; it holds tests behind a Cargo feature; run by name from scripts/mesh_stage_cost.py;
# run by name from scripts/mesh_stage_proof.py; run by name from scripts/mesh_stage_capture.py.
[[test]]
name = "mesh_stage_gpu"
path = "tests/mesh_stage_gpu/main.rs"

# A target of its own: it sets its binary's global allocator, so it runs apart.
[[test]]
name = "simulation"
path = "tests/simulation.rs"

# A target of its own: run by name from scripts/run_v1_showcase.py.
[[test]]
name = "valley_culling_gpu"
path = "tests/valley_culling_gpu.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "v1-game"
path = "src/main.rs"
test = false

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "apple_tile_residency"
required-features = ["proving"]
path = "src/bin/apple_tile_residency.rs"
test = false

[[test]]
name = "clouds_directed_gpu"
path = "tests/placed/clouds_directed_gpu.rs"

[[test]]
name = "clouds_placed_lease_gpu"
path = "tests/placed/clouds_placed_lease_gpu.rs"

[[test]]
name = "clouds_clear_gpu"
path = "tests/clouds_clear_gpu.rs"

[[test]]
name = "view_volume_medium_gpu"
path = "tests/view_volume/view_volume_medium_gpu.rs"

[[test]]
name = "ground_band_receivers_gpu"
path = "tests/view_volume/ground_band_receivers_gpu.rs"

[[test]]
name = "view_volume_handover_gpu"
path = "tests/view_volume/view_volume_handover_gpu.rs"

# RENDER-2D WP4 names this Metal residency and placement check.
[[test]]
name = "sprite_sheets_gpu"

[[test]]
name = "interface_valley"
required-features = ["proving"]

[[example]]
name = "interface_cost"
required-features = ["proving"]

[[test]]
name = "interface_text_gpu"
required-features = ["proving"]

[[example]]
name = "font_cost"
required-features = ["proving"]

# CLOUDS WP8.3 names the incident-meter proof on the game path.
[[test]]
name = "clouds_meter_gpu"
path = "tests/clouds_meter_gpu.rs"

# The CLOUDS controls contract has a named work-package check.
[[test]]
name = "clouds_controls"

[[test]]
name = "interface_status_sweep"
required-features = ["proving"]

[[test]]
name = "interface_status_gpu"
required-features = ["proving"]

[[test]]
name = "interface_status_switch"
required-features = ["proving"]

[[example]]
name = "interface_status"
required-features = ["proving"]
