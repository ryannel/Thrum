[package]
name = "match-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Headless multi-target reference crowd session proofs"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
crowd-2d = { path = "../crowd-2d" }
thrum-core = { path = "../../crates/thrum-core" }
thrum-network = { path = "../../crates/thrum-network" }
thrum-transport = { path = "../../crates/thrum-transport", default-features = false }
serde_json = "=1.0.154"

[build-dependencies]
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"
