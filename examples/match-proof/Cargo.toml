[package]
name = "match-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Multi-target reference crowd session proofs"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
sockets = ["thrum-transport/native", "thrum-transport/browser"]
windowed = ["sockets", "dep:crowd-2d-view", "dep:thrum-app", "dep:thrum-controls", "dep:thrum-render", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[lints]
workspace = true

[dependencies]
crowd-2d = { path = "../crowd-2d" }
crowd-2d-view = { path = "../crowd-2d-view", optional = true }
thrum-app = { path = "../../crates/thrum-app", optional = true }
thrum-controls = { path = "../../crates/thrum-controls", optional = true }
thrum-core = { path = "../../crates/thrum-core" }
thrum-network = { path = "../../crates/thrum-network" }
thrum-render = { path = "../../crates/thrum-render", optional = true }
thrum-transport = { path = "../../crates/thrum-transport", default-features = false }
serde_json = "=1.0.154"

[build-dependencies]
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"], optional = true }
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open item SWARM M5.6.
[[test]]
name = "prediction"
path = "tests/prediction.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "match-proof"
path = "src/main.rs"
test = false
