[package]
name = "thrum-lighthouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lighthouse scene: a striped tower with a lit lamp on a beach under a physically based sky"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
thrum-app = { path = "../../crates/thrum-app" }

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "thrum-lighthouse"
path = "src/main.rs"
test = false
