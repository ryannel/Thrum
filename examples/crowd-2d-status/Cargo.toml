[package]
name = "crowd-2d-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Crowd replay with a tick counter and a body count"

[lints]
workspace = true

[[bin]]
name = "crowd-2d-status"
path = "src/main.rs"
test = false

[dependencies]
crowd-2d-view = { path = "../crowd-2d-view" }
serde_json = "=1.0.154"
thrum-app = { path = "../../crates/thrum-app", features = ["interface"] }
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }
thrum-controls = { path = "../../crates/thrum-controls" }
thrum-core = { path = "../../crates/thrum-core" }
thrum-render = { path = "../../crates/thrum-render" }
thrum-ui = { path = "../../crates/thrum-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
thrum-asset = { path = "../../crates/thrum-asset" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
