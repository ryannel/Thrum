[package]
name = "mirror-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A flat mirror pool with scene-local lighting and aerial composition"
autotests = false

[lints]
workspace = true

[dependencies]
thrum-app = { path = "../../crates/thrum-app" }
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
pollster = "=1.0.1"

[dev-dependencies]
thrum-test-support = { path = "../../crates/thrum-test-support", features = ["render"] }
half = "=2.7.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
thrum-asset = { path = "../../crates/thrum-asset" }
thrum-asset-gpu = { path = "../../crates/thrum-asset-gpu" }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-time = "=1.1.0"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open item GATE-TIME M4.1; run by name from
# scripts/check_mirror_browser.mjs.
[[test]]
name = "pool_gpu"
path = "tests/pool_gpu/main.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "mirror-scene"
path = "src/main.rs"
test = false
