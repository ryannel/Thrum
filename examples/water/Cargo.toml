[package]
name = "water-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Open water under Thrum's sky"
autotests = false

# A target of its own: run by name from scripts/capture_water.py; run by name from
# scripts/water_cost.py.
[[test]]
name = "proof_gpu"

# A target of its own: its check is named by open item PUDDLES M3.2.
[[test]]
name = "bodies_gpu"

# A target of its own: its check is named by open item PUDDLES M3.2.
[[test]]
name = "stage_gpu"

# A target of its own: the main-tier list names it for its long tests.
[[test]]
name = "floating_gpu"

# A target of its own: its check is named by open items GATE-TIME M3.1, PUDDLES M5.4; the main-tier
# list names it for its long tests.
[[test]]
name = "foam_scene_gpu"

# WATERS M13.2 names this target.
[[test]]
name = "surf_capability_gpu"

# WATERS M13.3 names this target.
[[test]]
name = "surf_floating_gpu"

[lints]
workspace = true

[dependencies]
thrum-app = { path = "../../crates/thrum-app" }
thrum-water = { path = "../../crates/thrum-water" }
thrum-water-model = { path = "../../crates/thrum-water-model" }
thrum-sea-model = { path = "../../crates/thrum-sea-model" }
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
glam = { version = "=0.33.12", default-features = false, features = ["std", "f64"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"

[dev-dependencies]
pollster = "=1.0.1"
thrum-cook = { path = "../../crates/thrum-cook" }
thrum-test-support = { path = "../../crates/thrum-test-support", features = ["render"] }
serde_json = "=1.0.154"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "water-scene"
path = "src/main.rs"
test = false

# WATERS M13.9 names this target.
[[test]]
name = "surf_frame_gpu"
