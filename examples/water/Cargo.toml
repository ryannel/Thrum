[package]
name = "water-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Open water under Thrum's sky"
autotests = false

[[test]]
name = "scene_gpu"
[[test]]
name = "frame_contract_gpu"
[[test]]
name = "level_gpu"
[[test]]
name = "proof_gpu"

[lints]
workspace = true

[dependencies]
thrum-app = { path = "../../crates/thrum-app" }
thrum-water = { path = "../../crates/thrum-water" }
thrum-water-model = { path = "../../crates/thrum-water-model" }
thrum-sea-model = { path = "../../crates/thrum-sea-model" }

[dev-dependencies]
thrum-render = { path = "../../crates/thrum-render" }
thrum-test-support = { path = "../../crates/thrum-test-support", features = ["render"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
