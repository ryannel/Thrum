[package]
name = "water-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Open water under Thrum's sky"
autotests = false

# A target of its own: run by name from scripts/capture_water.py; run by name from
# scripts/water_cost.py.
[[test]]
name = "proof_gpu"

# A target of its own: its check is named by open item PUDDLES M3.2.
[[test]]
name = "bodies_gpu"

# A target of its own: its check is named by open item PUDDLES M3.2.
[[test]]
name = "stage_gpu"

# A target of its own: the main-tier list names it for its long tests.
[[test]]
name = "floating_gpu"

# A target of its own: its check is named by open items GATE-TIME M3.1, PUDDLES M5.4; the main-tier
# list names it for its long tests.
[[test]]
name = "foam_scene_gpu"

# WATERS M13.2 names this target.
[[test]]
name = "surf_capability_gpu"

# WATERS M13.3 names this target.
[[test]]
name = "surf_floating_gpu"

[lints]
workspace = true

[dependencies]
thrum-app = { path = "../../crates/thrum-app" }
thrum-water = { path = "../../crates/thrum-water" }
thrum-water-model = { path = "../../crates/thrum-water-model" }
thrum-rain-model = { path = "../../crates/thrum-rain-model" }
thrum-sea-model = { path = "../../crates/thrum-sea-model" }
thrum-render = { path = "../../crates/thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
glam = { version = "=0.33.12", default-features = false, features = ["std", "f64"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thrum-river-model = { path = "../../crates/thrum-river-model" }

[dev-dependencies]
thrum-render = { path = "../../crates/thrum-render", features = ["creation-counters"] }
thrum-sea = { path = "../../crates/thrum-sea" }
pollster = "=1.0.1"
thrum-cook = { path = "../../crates/thrum-cook" }
thrum-test-support = { path = "../../crates/thrum-test-support", features = ["render"] }
serde_json = "=1.0.154"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "water-scene"
path = "src/main.rs"
test = false

# WATERS M13.9 names this target.
[[test]]
name = "surf_frame_gpu"

# WATERS WP8's focused Metal proofs.
[[test]]
name = "gather_gpu"

[[test]]
name = "cloud_shade_gpu"

[[test]]
name = "optics_once_gpu"

# The WATERS channel proofs read submitted Metal depth and transport.
[[test]]
name = "channel_gpu"

[[test]]
name = "carriage_gpu"

# PUDDLES WP3.4–6 run this proof on Metal.
[[test]]
name = "puddles_gpu"

# PUDDLES WP3.1 proves the deployed scene selection on Metal.
[[test]]
name = "rain_selection_gpu"

# RIVERS WP4 names the native store and Metal proofs.
[[test]]
name = "river_store"

[[test]]
name = "river_gpu"

# PUDDLES WP4 compares the submitted Metal bands with the model.
[[test]]
name = "rain_bands_gpu"

# The open WATERS underwater items name these test targets.
[[test]]
name = "under_once_gpu"

[[test]]
name = "under_frame_gpu"

[[test]]
name = "lens_gpu"

# RIVERS WP5 names these Metal checks.
[[test]]
name = "flow_bands_gpu"

[[test]]
name = "river_foam_gpu"

# PUDDLES WP5 checks these Metal targets.
[[test]]
name = "wet_provider_gpu"

[[test]]
name = "wet_look_gpu"

[[test]]
name = "standing_film_gpu"

[[test]]
name = "wet_shore_gpu"
