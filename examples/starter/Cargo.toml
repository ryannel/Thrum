[package]
name = "thrum-starter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Starter scene: a physically based sky, lit ground, one cooked mesh, a camera and Sun sliders"

[lints]
workspace = true

[dependencies]
thrum-app = { path = "../../crates/thrum-app" }

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "thrum-starter"
path = "src/main.rs"
test = false
