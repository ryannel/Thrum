[package]
name = "crowd-2d-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sprite view of the retained Crowd simulation"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crowd-2d-view"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
crowd-2d = { path = "../crowd-2d" }
thrum-app = { path = "../../crates/thrum-app" }
thrum-controls = { path = "../../crates/thrum-controls" }
thrum-core = { path = "../../crates/thrum-core" }
thrum-render = { path = "../../crates/thrum-render" }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
pollster = "=1.0.1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
web-time = "=1.1.0"
