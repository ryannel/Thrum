<!doctype html>
<meta charset="utf-8">
<title>Crowd view</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b111b; }
  canvas { display: block; width: 100%; height: 100%; }
  output { position: absolute; inset: 1rem auto auto 1rem; color: white; }
  output:empty { display: none; }
</style>
<canvas aria-label="The Crowd simulation"></canvas>
<output role="status"></output>
<script type="module">
import init, { BrowserCrowd } from './crowd_2d_view.js';
const canvas = document.querySelector('canvas');
const error = document.querySelector('output');
try {
  await init();
  const close = new URL(location.href).searchParams.get('view') === 'close';
  function resize() {
    canvas.width = Math.max(1, Math.round(canvas.clientWidth * devicePixelRatio));
    canvas.height = Math.max(1, Math.round(canvas.clientHeight * devicePixelRatio));
  }
  resize();
  const crowd = await BrowserCrowd.open(canvas, 10000, close, false, false);
  new ResizeObserver(resize).observe(canvas);
  function frame(now) {
    try {
      crowd.step(now);
      requestAnimationFrame(frame);
    } catch (failure) {
      error.textContent = failure;
    }
  }
  requestAnimationFrame(frame);
} catch (failure) {
  error.textContent = failure;
}
</script>
