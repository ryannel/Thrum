[workspace]
members = ["crates/thrum-core", "crates/thrum-mobile-shell", "tools/xtask"]
default-members = ["crates/thrum-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A fixed argument count can force needless parameter structs. Review API shape
# against ownership and call sites instead of using this numeric gate.
too_many_arguments = { level = "allow", priority = 1 }
