[package]
name = "thrum-sea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Frame-time ambient wave fields on the scene effect graph"
autotests = false

# A target of its own: its check is named by open items HOST M5.2, REVIEW-RENDER M4.2.
[[test]]
name = "error_types"

[lints]
workspace = true

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
thrum-sea-model = { path = "../thrum-sea-model" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
pollster = "=1.0.1"
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
