[package]
name = "thrum-sea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Frame-time ambient wave fields on the scene effect graph"
autotests = false

[[test]]
name = "ambient_gpu"

[[test]]
name = "frames_gpu"

[[test]]
name = "portable_limits_gpu"

[[test]]
name = "upload_cost"

[[test]]
name = "wgsl_records"

[[test]]
name = "declared_accesses"

[[test]]
name = "upload_bytes"

[lints]
workspace = true

[[test]]
name = "forward_cache_gpu"
path = "tests/forward_cache_gpu.rs"

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
thrum-sea-model = { path = "../thrum-sea-model" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }

