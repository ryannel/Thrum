[package]
name = "thrum-water-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# support.rs is a shared module with children, not an integration-test crate root.
autotests = false

[dependencies]
thrum-sea-model = { path = "../thrum-sea-model" }

