[package]
name = "thrum-water-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# support.rs is a shared module with children, not an integration-test crate root.
autotests = false

[dependencies]
thrum-sea-model = { path = "../thrum-sea-model" }

[lints]
workspace = true

[dev-dependencies]
thrum-fixtures = { path = "../thrum-fixtures" }
divan = "=0.1.21"

[[bench]]
name = "surf"
path = "tests/support/bench.rs"
harness = false

# A target of its own: the main-tier list names it for its long tests.
[[test]]
name = "shore_blend"
path = "tests/shore_blend.rs"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
