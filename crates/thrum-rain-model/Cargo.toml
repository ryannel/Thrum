[package]
name = "thrum-rain-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
thrum-water-model = { path = "../thrum-water-model" }

[dev-dependencies]
thrum-sea-model = { path = "../thrum-sea-model" }

[lints]
workspace = true

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
