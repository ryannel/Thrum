[package]
name = "thrum-water"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared water surface on the scene effect graph"
autotests = false

[[test]]
name = "map_gpu"
[[test]]
name = "gains_gpu"
[[test]]
name = "query_gpu"
[[test]]
name = "interaction_gpu"
[[test]]
name = "foam_gpu"

[lints]
workspace = true

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-render = { path = "../thrum-render" }
thrum-sea = { path = "../thrum-sea" }
thrum-sea-model = { path = "../thrum-sea-model" }
thrum-water-model = { path = "../thrum-water-model" }
web-time = "=1.1.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
pollster = "=1.0.1"
thrum-core = { path = "../thrum-core" }
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }
