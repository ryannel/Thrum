[package]
name = "thrum-water"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared water surface on the scene effect graph"
autotests = false

# A target of its own: its check is named by open items PUDDLES M8.3, RIVERS M6.11, RIVERS M6.3.
[[test]]
name = "interaction_gpu"

[[test]]
name = "surf_gpu"

[lints]
workspace = true

[dependencies]
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-render = { path = "../thrum-render" }
thrum-sea = { path = "../thrum-sea" }
thrum-sea-model = { path = "../thrum-sea-model" }
thrum-water-model = { path = "../thrum-water-model" }
web-time = "=1.1.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[dev-dependencies]
thrum-fixtures = { path = "../thrum-fixtures" }
pollster = "=1.0.1"
thrum-core = { path = "../thrum-core" }
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
