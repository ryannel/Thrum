[package]
name = "thrum-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thrum's shared simulation identities, clock and provisional world"
autotests = false

[lints]
workspace = true

[features]
conformance-control = []

[dependencies]
smallvec = "=1.16.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[dev-dependencies]
divan = "=0.1.21"
thrum-test-support = { path = "../thrum-test-support" }

[[bench]]
name = "v1_workload"
path = "tests/support/workload_bench.rs"
harness = false

# A target of its own: it sets its binary's global allocator, so it runs apart.
[[test]]
name = "v1_workload"
path = "tests/support/workload_test.rs"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open items HOST M5.2, REVIEW-RENDER M4.2.
[[test]]
name = "error_types"
path = "tests/error_types.rs"

# A target of its own: it sets its binary's global allocator, so it runs apart.
[[test]]
name = "world_image_untrusted"
path = "tests/world_image_untrusted/main.rs"

# Target named directly by the SESSION WP7.1 check.
[[test]]
name = "driven_world"
path = "tests/driven_world.rs"
