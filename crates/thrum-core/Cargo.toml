[package]
name = "thrum-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Thrum's shared simulation identities, clock and provisional world"

[lints]
workspace = true

[features]
conformance-control = []

[dependencies]
smallvec = "=1.16.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "=1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[dev-dependencies]
divan = "=0.1.21"
thrum-test-support = { path = "../thrum-test-support" }

[[bench]]
name = "v1_workload"
path = "tests/support/workload_bench.rs"
harness = false

[[test]]
name = "v1_workload"
path = "tests/support/workload_test.rs"

[[test]]
name = "profile_refusal"
path = "tests/support/profile_refusal.rs"

[[test]]
name = "world_digest"
path = "tests/support/world_digest.rs"
