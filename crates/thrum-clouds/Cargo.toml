[package]
name = "thrum-clouds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Weather and Sun-path GPU products on the scene effect graph"
autotests = false

[[test]]
name = "transport_gpu"

[[test]]
name = "shadow_only_gpu"

[[test]]
name = "sun_path_gpu"

[[test]]
name = "portable_limits_gpu"

[lints]
workspace = true

[dependencies]
thrum-cloud-model = { path = "../thrum-cloud-model" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }

[dev-dependencies]
thrum-core = { path = "../thrum-core" }
pollster = "=1.0.1"
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }
