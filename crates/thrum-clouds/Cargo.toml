[package]
name = "thrum-clouds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Weather and Sun-path GPU products on the scene effect graph"
autotests = false

[lints]
workspace = true

[dependencies]
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-cloud-model = { path = "../thrum-cloud-model" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }

[dev-dependencies]
thrum-asset = { path = "../thrum-asset" }
thrum-cook = { path = "../thrum-cook" }
thrum-core = { path = "../thrum-core" }
pollster = "=1.0.1"
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "placed_gpu"
path = "tests/placed_gpu.rs"

[[test]]
name = "placed_shadow_only_gpu"
path = "tests/placed_shadow_only_gpu.rs"

[[test]]
name = "placed_shade_gpu"
path = "tests/placed_shade_gpu.rs"
