[package]
name = "thrum-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false
description = "Thrum's typed GPU graph and prepared synthetic renderer foundation"

[lints]
workspace = true

[features]
# Opt-in G3t D0.3 diagnostic: GPU object creation counts by phase and the
# after-readiness pipeline guard (`runtime::FrameHost::creation_report`).
creation-counters = ["wgpu/counters", "dep:profiling"]
test-support = []

[dependencies]
thrum-asset = { path = "../thrum-asset" }
thrum-core = { path = "../thrum-core" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
half = { version = "=2.7.1", default-features = false }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "MTLDevice", "MTLResource", "MTLTexture", "MTLCommandBuffer", "MTLCommandEncoder", "MTLBlitCommandEncoder", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary", "MTLTypes"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "=1.0.1"
profiling = { version = "=1.0.18", default-features = false, features = ["profile-with-tracing"], optional = true }

[dev-dependencies]
thrum-fixtures = { path = "../thrum-fixtures" }
thrum-test-support = { path = "../thrum-test-support", features = ["render-registry"] }
serde_json = "=1.0.154"
pollster = "=1.0.1"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"] }

# Every test file here is a target of its own, not a module of one `it` target (GATE-TIME mechanism
# 10): the main-tier list's `creation-counters` line runs every test binary of this package through
# `cargo test`, where a binary's tests share one process and its device. The shared fixtures
# `support.rs`, `ray_support.rs` and `ray_shadow_support.rs` hold no test, so they are modules of
# the files that use them and not targets.
[[test]]
name = "graph_kinds"
path = "tests/graph_kinds_support/graph_kinds.rs"

[[test]]
name = "effect_state"
path = "tests/graph_kinds_support/effect_state.rs"

