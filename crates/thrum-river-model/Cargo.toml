[package]
name = "thrum-river-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# support.rs is a shared module with children, not an integration-test crate root.
autotests = false

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
rayon = "=1.12.0"
thrum-water-model = { path = "../thrum-water-model" }

[dev-dependencies]
thrum-sea-model = { path = "../thrum-sea-model" }

[lints]
workspace = true

[[example]]
name = "valley_cost"
path = "tests/support/valley_cost.rs"

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"
