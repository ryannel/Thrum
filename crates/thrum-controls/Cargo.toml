[package]
name = "thrum-controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Typed demo controls shared by native and browser views"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSArray", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSGraphics", "NSLayoutConstraint", "NSPanel", "NSResponder", "NSSlider", "NSSliderCell", "NSStackView", "NSText", "NSTextField", "NSUserInterfaceLayout", "NSView", "NSWindow", "NSColor", "NSFont", "NSActionCell", "NSScreen", "NSLayoutAnchor", "NSFontDescriptor", "NSBitmapImageRep", "NSImageRep"] }

[lints]
workspace = true
