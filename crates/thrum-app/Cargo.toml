[package]
name = "thrum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Application shells shared by Thrum games: the native macOS window, display link and render owner, and the browser WebGPU canvas shell"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zstd = { version = "=0.13.3", default-features = false, features = ["zstdmt"] }
sha2 = { version = "=0.10.9", features = ["asm-aarch64"] }
thrum-render = { path = "../thrum-render" }

[target.'cfg(target_os = "macos")'.dependencies]
pollster = "=1.0.1"
cpu-time = "=1.0.0"
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-controls = { path = "../thrum-controls" }
thrum-core = { path = "../thrum-core" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObject", "NSRunLoop"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CABase", "CADisplayLink", "CAFrameRateRange"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }

[build-dependencies]
cc = "=1.10.0"

[lints]
workspace = true
