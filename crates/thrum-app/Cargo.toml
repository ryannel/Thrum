[package]
name = "thrum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native macOS window, display link and render owner shared by Thrum games"

[target.'cfg(target_os = "macos")'.dependencies]
pollster = "=1.0.1"
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-controls = { path = "../thrum-controls" }
thrum-core = { path = "../thrum-core" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSObject", "NSRunLoop"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CABase", "CADisplayLink", "CAFrameRateRange"] }

[lints]
workspace = true
