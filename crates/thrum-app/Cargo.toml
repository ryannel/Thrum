[package]
name = "thrum-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Application shells shared by Thrum games: the native macOS window, display link and render owner, and the browser WebGPU canvas shell"
autotests = false

[features]
creation-counters = ["thrum-render/creation-counters"]

[dependencies]
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-controls = { path = "../thrum-controls" }
thrum-core = { path = "../thrum-core" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zstd = { version = "=0.13.3", default-features = false, features = ["zstdmt"] }
sha2 = { version = "=0.10.9", features = ["asm-aarch64"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "=1.0.154"
pollster = "=1.0.1"
cpu-time = "=1.0.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSScreen", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSNotification", "NSObject", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "objc2-core-foundation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
thrum-asset = { path = "../thrum-asset" }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
wgpu = { version = "=30.0.1", default-features = false, features = ["webgpu"] }
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }

[build-dependencies]
cc = "=1.10.0"

[dev-dependencies]
pollster = "=1.0.1"
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }

# The capture writer's tests build on every native platform; its Apple builds take the tuned features above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sha2 = "=0.10.9"
zstd = { version = "=0.13.3", default-features = false, features = ["zstdmt"] }

[lints]
workspace = true

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# HOST M4 calls this target by name.
[[test]]
name = "game_contract"
path = "tests/game_contract.rs"
