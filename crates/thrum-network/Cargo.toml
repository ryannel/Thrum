[package]
name = "thrum-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
thrum-core = { path = "../thrum-core" }
thrum-transport = { path = "../thrum-transport", default-features = false }
getrandom = { version = "=0.2.17", features = ["js"] }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open items HOST M5.2, REVIEW-RENDER M4.2.
[[test]]
name = "error_types"
path = "tests/error_types.rs"
