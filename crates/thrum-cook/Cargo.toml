[package]
name = "thrum-cook"
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Authoring-only Thrum asset cooker: stat cache, BLAKE3 CAS, cookers, atomic manifest, watcher and dev server"
autotests = false

[lints]
workspace = true

[features]
fault-probe = []

[dependencies]
astcenc-rs = "=0.2.0"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "rayon"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = "=0.5.0"
meshopt = "=0.7.0"
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
harfrust = "=0.16.0"
skrifa = "=0.50.0"
unicode-normalization = "=0.1.26"
zeno = "=0.3.3"
thrum-asset = { path = "../thrum-asset" }

[dev-dependencies]
thrum-asset-gpu = { path = "../thrum-asset-gpu" }
thrum-core = { path = "../thrum-core" }
thrum-render = { path = "../thrum-render" }
pollster = "=1.0.1"
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std"] }

[[bench]]
name = "edit_to_visible"
path = "tests/edit_to_visible/bench.rs"
harness = false

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open items HOST M5.2, REVIEW-RENDER M4.2.
[[test]]
name = "error_types"
path = "tests/error_types.rs"

# The binary holds no test, so the test runner neither builds nor starts it as one.
[[bin]]
name = "thrum-cook"
path = "src/main.rs"
test = false

# RENDER-2D WP4 names both product checks.
[[test]]
name = "sheet_cook"

[[test]]
name = "sheet_hostile"

# GAME-UI WP2 names both product checks.
[[test]]
name = "font_cook"

[[test]]
name = "font_hostile"
