[package]
name = "thrum-asset-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "GPU residency for cooked G5 products: staged budgeted uploads, meshlet culling, scene contribution"

[lints]
workspace = true

[features]
draw-probe = []

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
thrum-asset = { path = "../thrum-asset" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
