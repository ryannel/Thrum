[package]
name = "thrum-asset-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "GPU residency for cooked G5 products: staged budgeted uploads, meshlet culling, scene contribution"
autotests = false

[lints]
workspace = true

[features]
draw-probe = ["thrum-render/creation-counters"]
fault-probe = []

[dev-dependencies]
thrum-test-support = { path = "../thrum-test-support", features = ["render"] }
thrum-core = { path = "../thrum-core" }
pollster = "=1.0.1"
half = { version = "=2.7.1", default-features = false }

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.12", default-features = false, features = ["std"] }
thrum-asset = { path = "../thrum-asset" }
thrum-render = { path = "../thrum-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "=1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

# Integration tests: one target `it` holds every test file (GATE-TIME mechanism 10); a file is a
# target of its own below only while something names its binary or it has to run apart.
[[test]]
name = "it"
path = "tests/it.rs"

# A target of its own: its check is named by open items HOST M5.2, REVIEW-RENDER M4.2; the main-tier
# list names it for its tests behind a feature; it holds tests behind a Cargo feature.
[[test]]
name = "error_types"
path = "tests/error_types.rs"

