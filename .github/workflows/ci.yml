name: repository
on: [workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      THRUM_PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned contributor toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
      - name: Fetch locked dependencies for offline checks
        run: rustup run 1.99.1 cargo fetch --locked
      - name: Check repository, game Wasm build and native tests
        run: ./dev check
