# Register real packages and direct workspace dependencies here when introducing them.
# Module design responsibilities are not a prescription for one crate each.
[boundaries]
external_game = "v1-game"
game_manifest = "examples/v1-game/Cargo.toml"
proving_ground = "v1-game"

[packages.thrum-test-support]
manifest = "crates/thrum-test-support/Cargo.toml"
test_role = "support"
allowed_workspace_dependencies = ["thrum-render"]

[packages.thrum-core]
manifest = "crates/thrum-core/Cargo.toml"
allowed_workspace_dependencies = ["thrum-test-support"]

[packages.thrum-sim2d]
manifest = "crates/thrum-sim2d/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core", "thrum-test-support"]

[packages.crowd-2d]
manifest = "examples/crowd-2d/Cargo.toml"
rule_package = true
allowed_workspace_dependencies = ["thrum-core", "thrum-sim2d"]

[packages.crowd-2d.conformance]
runner = "crowd-2d-run"
sizes = [[2000, 3600], [5000, 3600], [10000, 36000]]
vectors = "crates/thrum-core/src/profile/vectors.json"
witnesses = ["reused", "hits", "rewinds", "changed_rewinds"]
traces = [
    { name = "crowd", retained = "examples/crowd-2d/retained/crowd.txt", variant = false, witnesses = [] },
    { name = "mixed", retained = "examples/crowd-2d/retained/mixed.txt", variant = true, witnesses = ["oversize", "capsule_hits", "swept_only_hits"] },
]

[packages.crowd-2d.conformance.control]
name = "platform-sine"
bodies = 2000
ticks = 240

[packages.crowd-2d-view]
manifest = "examples/crowd-2d-view/Cargo.toml"
allowed_workspace_dependencies = ["crowd-2d", "thrum-app", "thrum-controls", "thrum-core", "thrum-render"]
implicit_dependencies = { wasm-bindgen-futures = "async wasm_bindgen exports use wasm_bindgen_futures" }

[packages.crowd-2d-run]
manifest = "examples/crowd-2d-run/Cargo.toml"
allowed_workspace_dependencies = ["crowd-2d", "thrum-core", "thrum-network"]

[packages.match-proof]
manifest = "examples/match-proof/Cargo.toml"
allowed_workspace_dependencies = ["crowd-2d", "crowd-2d-view", "thrum-app", "thrum-controls", "thrum-core", "thrum-network", "thrum-render", "thrum-transport"]
implicit_dependencies = { wasm-bindgen-futures = "the windowed proof's async wasm_bindgen export" }

[packages.thrum-sea-model]
manifest = "crates/thrum-sea-model/Cargo.toml"
# CPU spectrum and conformance oracle; no graphics or game dependencies.
allowed_workspace_dependencies = []

[packages.thrum-cloud-model]
manifest = "crates/thrum-cloud-model/Cargo.toml"
# Deterministic CPU weather authority and optics oracle, independent of graphics.
allowed_workspace_dependencies = []

[packages.thrum-sea]
manifest = "crates/thrum-sea/Cargo.toml"
allowed_workspace_dependencies = ["thrum-sea-model", "thrum-render", "thrum-test-support"]

[packages.thrum-clouds]
manifest = "crates/thrum-clouds/Cargo.toml"
allowed_workspace_dependencies = ["thrum-cloud-model", "thrum-render", "thrum-test-support", "thrum-core", "thrum-asset", "thrum-asset-gpu", "thrum-cook"]

[packages.thrum-water-model]
manifest = "crates/thrum-water-model/Cargo.toml"
# CPU water map, wave composition and query oracle; no graphics dependencies.
allowed_workspace_dependencies = ["thrum-sea-model", "thrum-fixtures"]

[packages.thrum-water]
manifest = "crates/thrum-water/Cargo.toml"
allowed_workspace_dependencies = ["thrum-asset-gpu", "thrum-render", "thrum-sea", "thrum-sea-model", "thrum-water-model", "thrum-test-support", "thrum-core", "thrum-fixtures"]

[packages.water-scene]
manifest = "examples/water/Cargo.toml"
allowed_workspace_dependencies = ["thrum-app", "thrum-render", "thrum-water", "thrum-water-model", "thrum-sea-model", "thrum-test-support", "thrum-cook"]

[packages.thrum-river-model]
manifest = "crates/thrum-river-model/Cargo.toml"
# Steady river flow solver, its energy account and the river file's writer; CPU only, no graphics dependencies.
# thrum-sea-model only as a test dependency, for the wave field the tests read the surface through.
allowed_workspace_dependencies = ["thrum-sea-model", "thrum-water-model"]

[packages.thrum-rain-model]
manifest = "crates/thrum-rain-model/Cargo.toml"
# CPU tree of hollows, fill step and account, canopy exposure and the rain state; no graphics dependencies.
# thrum-sea-model only as a test dependency, for the conformance harness's wave field.
allowed_workspace_dependencies = ["thrum-sea-model", "thrum-water-model"]

[packages.thrum-controls]
manifest = "crates/thrum-controls/Cargo.toml"
# G6 typed demo controls: one model, AppKit and DOM views; no game schema, no I/O.
allowed_workspace_dependencies = []

[packages.thrum-app]
manifest = "crates/thrum-app/Cargo.toml"
# G6 native macOS shell: window, Metal device recipe, display link, render owner, pause,
# device recovery, demo-control panel and frames report. G3b browser shell (`web`, wasm32
# only): WebGPU canvas surface and device, loss gating and replacement, page clock and frame
# step. Generic over a game's runtime; it names no game types and no content package. Its sky kit draws cooked meshes through
# thrum-asset-gpu and the verified G5 browser client (the engine's shipping residency path), so a creator's scene needs no
# status or store plumbing of its own.
allowed_workspace_dependencies = ["thrum-asset", "thrum-asset-gpu", "thrum-controls", "thrum-core", "thrum-render", "thrum-test-support"]

[packages.thrum-asset]
manifest = "crates/thrum-asset/Cargo.toml"
# Runtime half of G5: shipping games read cooked products through this package only.
allowed_workspace_dependencies = []

[packages.thrum-asset-gpu]
manifest = "crates/thrum-asset-gpu/Cargo.toml"
# Shipping GPU residency for cooked products, drawn through thrum-render's scene-contribution seam.
allowed_workspace_dependencies = ["thrum-asset", "thrum-cook", "thrum-core", "thrum-render", "thrum-test-support"]

[packages.thrum-cook]
manifest = "crates/thrum-cook/Cargo.toml"
# Authoring-only G5 cooker; no shipping package may depend on it.
# The edit-to-visible test and bench host the shipping loader through engine APIs only.
allowed_workspace_dependencies = ["thrum-asset", "thrum-asset-gpu", "thrum-core", "thrum-render", "thrum-test-support"]

[packages.thrum-render]
manifest = "crates/thrum-render/Cargo.toml"
allowed_workspace_dependencies = ["thrum-asset", "thrum-core", "thrum-test-support", "thrum-fixtures"]
implicit_dependencies = { profiling = "Enable native wgpu resource-creation spans for the opt-in creation counter proof" }

[packages.thrum-ui]
manifest = "crates/thrum-ui/Cargo.toml"
allowed_workspace_dependencies = ["thrum-asset", "thrum-render", "thrum-core", "thrum-test-support", "thrum-cook"]

[packages.thrum-fixtures]
manifest = "crates/thrum-fixtures/Cargo.toml"
test_role = "fixtures"
allowed_workspace_dependencies = []

[packages.thrum-network]
manifest = "crates/thrum-network/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core", "thrum-transport"]

[packages.thrum-transport]
manifest = "crates/thrum-transport/Cargo.toml"
allowed_workspace_dependencies = ["thrum-test-support"]

[packages.link-proof]
manifest = "examples/link-proof/Cargo.toml"
allowed_workspace_dependencies = ["thrum-transport"]

[packages.xtask]
manifest = "tools/xtask/Cargo.toml"
allowed_workspace_dependencies = []

[packages.v1-game]
manifest = "examples/v1-game/Cargo.toml"
# thrum-asset-gpu draws cooked products (a mapped store natively, a fetched generation on wasm32); thrum-cook is a dev-dependency
# only, for the in-game G5 tests and bench.
allowed_workspace_dependencies = ["thrum-app", "thrum-asset", "thrum-asset-gpu", "thrum-controls", "thrum-cook", "thrum-core", "thrum-render", "thrum-ui", "thrum-cloud-model", "thrum-clouds", "thrum-test-support", "thrum-fixtures"]
implicit_dependencies = { wasm-bindgen-futures = "async wasm_bindgen export expansion calls wasm_bindgen_futures" }

[packages.thrum-starter]
manifest = "examples/starter/Cargo.toml"
# G6 starter: the sky kit in thrum-app (which re-exports its controls and cooked-mesh types);
# no engine game types. `./dev starter` cooks and watches its assets with thrum-cook as a
# separate process, so it never depends on the authoring cooker.
allowed_workspace_dependencies = ["thrum-app"]

[packages.thrum-lighthouse]
manifest = "examples/lighthouse/Cargo.toml"
# G6 creator trial: the third fresh-agent scene (a lighthouse), kept compiling against the kit.
allowed_workspace_dependencies = ["thrum-app"]

[packages.mirror-scene]
manifest = "examples/mirror/Cargo.toml"
allowed_workspace_dependencies = ["thrum-app", "thrum-asset", "thrum-asset-gpu", "thrum-render", "thrum-test-support"]

[packages.thrum-stones]
manifest = "examples/stones/Cargo.toml"
# G6 creator trial: the first fresh-agent scene (a stone circle at dawn), ported to the kit.
allowed_workspace_dependencies = ["thrum-app"]

[packages.v1-game-ios]
manifest = "examples/v1-game-ios/Cargo.toml"
allowed_workspace_dependencies = ["v1-game", "thrum-render", "thrum-core", "thrum-asset-gpu", "thrum-app", "thrum-test-support"]

# Every direct third-party crate must be listed here with an exact Cargo
# requirement, its declared license, purpose and target/build cost note.
# The check validates declarations; license/provenance review remains human work.
[external_dependencies]

[external_dependencies.getrandom]
requirement = "=0.4.3"
license = "MIT OR Apache-2.0"
purpose = "Issue unguessable reconnect tokens from platform entropy"
target_cost = "One 16-byte entropy read on the host per new player, including Web Crypto on Wasm"

[external_dependencies.quinn]
requirement = "=0.11.12"
license = "MIT OR Apache-2.0"
purpose = "Opt-in raw QUIC and WebTransport native message carrier"
target_cost = "Native adapter only: one I/O runtime per host/client, bounded buffers and packet encryption"

[external_dependencies.rustls]
requirement = "=0.23.46"
license = "MIT OR Apache-2.0 OR ISC"
purpose = "QUIC TLS with a mandatory pinned SHA-256 certificate verifier"
target_cost = "Opt-in native handshake and per-packet crypto through ring; no default core dependency"

[external_dependencies.rcgen]
requirement = "=0.14.10"
license = "MIT OR Apache-2.0"
purpose = "Ephemeral 13-day P-256 host identity"
target_cost = "Native adapter startup only; private key and certificate remain in memory"

[external_dependencies.time]
requirement = "=0.3.55"
license = "MIT OR Apache-2.0"
purpose = "Set the host certificate's validity interval"
target_cost = "Native identity startup only"

[external_dependencies.tokio]
requirement = "=1.54.1"
license = "MIT"
purpose = "Single-threaded I/O runtime for opt-in native links, and link-proof's hostile peers"
target_cost = "One network thread per host/client; no game-thread await"

[external_dependencies.web-transport-quinn]
requirement = "=0.13.6"
license = "MIT OR Apache-2.0"
purpose = "HTTP/3 WebTransport sessions on the host's existing QUIC endpoint; link-proof's hostile peers speak raw QUIC and WebTransport through it"
target_cost = "Native adapter only; adds HTTP/3 startup and WebTransport datagram prefix"

[external_dependencies.url]
requirement = "=2.5.8"
license = "MIT OR Apache-2.0"
purpose = "Proof tooling only: the hostile WebTransport peer's request URL in link-proof"
target_cost = "Already locked through web-transport-quinn; link-proof's native binary only, never a shipping closure"

[external_dependencies.serde]
requirement = "=1.0.229"
license = "MIT OR Apache-2.0"
purpose = "Typed showcase scene and sprite-sheet descriptions, decoded at activation or cook time"
target_cost = "Native scene parsing and the authoring-only cooker; derive-generated schema validation off the tick and frame path"

[external_dependencies.serde_json]
requirement = "=1.0.154"
license = "MIT OR Apache-2.0"
purpose = "Decode authored scene recipes and controls; write opt-in native profiler evidence and read temporal witnesses; the contributor tool reads cargo metadata"
target_cost = "Cold scene/control parsing; native profiler evidence serializes only when explicitly requested, four times a second off the render path; host-only in tools/xtask"

[external_dependencies.profiling]
requirement = "=1.0.18"
license = "MIT OR Apache-2.0"
purpose = "Expose wgpu creation calls as thread-local tracing spans through the native creation-counters feature"
target_cost = "Optional native diagnostic coverage only; already transitive through wgpu"

[external_dependencies.tracing]
requirement = "=0.1.44"
license = "MIT"
purpose = "Observe actual wgpu creation calls on both threads in the Metal resize test"
target_cost = "The renderer uses it directly only in tests"

[external_dependencies.tracing-subscriber]
requirement = "=0.3.23"
license = "MIT"
purpose = "Register a test observer of wgpu creation spans for the Metal resize proof"
target_cost = "Test-only registry without formatting or logging features"

[external_dependencies.rayon]
requirement = "=1.12.0"
license = "MIT OR Apache-2.0"
purpose = "Native frame extraction, optional parallel registered simulation jobs and the river solve's rows"
target_cost = "Native-only worker pool; the V1 simulation measures serial/Rayon crossover and the browser stays serial. Core-class affinity is selected by the platform runtime rather than assumed by a tick"

[external_dependencies.wasm-bindgen]
requirement = "=0.2.129"
license = "MIT OR Apache-2.0"
purpose = "Export the existing V1 frame host to a thin Chrome WebGPU page; bind the global fetch for the G5 Wasm dev-server client"
target_cost = "Wasm only. V1: JS/Wasm boundary once per animation callback, with no duplicate simulation or render implementation. thrum-asset: two imported functions and one response type, crossed once per HEAD poll and per fetched product"

[external_dependencies.wasm-bindgen-futures]
requirement = "=0.4.79"
license = "MIT OR Apache-2.0"
purpose = "Support the async exported V1 browser game constructor generated by wasm-bindgen; the thrum-app web shell's detached device replacement; await fetch promises in the G5 Wasm dev-server client"
target_cost = "Wasm only. V1 and the web shell: startup and device replacement only, no per-frame use. thrum-asset: one promise bridge per HEAD poll and per fetched product, on the loader path, never the frame"

[external_dependencies.js-sys]
requirement = "=0.3.106"
license = "MIT OR Apache-2.0"
purpose = "Promise and Uint8Array bindings for the G5 Wasm dev-server client and opt-in transport adapter"
target_cost = "Wasm only: one copy of each fetched body into aligned asset memory, and one boundary per whole transport message; proof tools use Date for payload identity"

[external_dependencies.wasm-bindgen-test]
requirement = "=0.3.79"
license = "MIT OR Apache-2.0"
purpose = "Run the G5 Wasm dev-server client end to end under wasm-bindgen-test-runner against thrum-cook serve"
target_cost = "Wasm-only dev-dependency of thrum-asset; adds five small test-harness crates to the lockfile, nothing to any shipping build"

[external_dependencies.web-sys]
requirement = "=0.3.106"
license = "MIT OR Apache-2.0"
purpose = "Pass the browser canvas to wgpu without a second window framework"
target_cost = "Browser V1 scene and the thrum-app web shell only, with canvas and diagnostic console bindings; no DOM traversal or per-frame browser object retention"

[external_dependencies.web-time]
requirement = "=1.1.0"
license = "MIT OR Apache-2.0"
purpose = "Measure browser world, frame and cooked-asset stages with the Web Performance monotonic clock"
target_cost = "Wasm-only timing at measured stage boundaries. Native builds use std::time."

[external_dependencies.divan]
requirement = "=0.1.21"
license = "MIT OR Apache-2.0"
purpose = "Deterministic V1 workload timing and allocation-count benchmarks for simulation, link conditioning and assembled GPU frames"
target_cost = "Development-only benchmark dependency; no runtime or target-device dependency, with benchmark compilation and timing overhead measured separately"

[external_dependencies.smallvec]
requirement = "=1.16.4"
license = "MIT OR Apache-2.0"
purpose = "Inline storage for up to eight game actions per input frame without steady-tick heap allocation"
target_cost = "Already transitive in the locked workspace; one direct thrum-core dependency, 8-action inline payload; larger frames remain rejected by the V1 game configuration"

[external_dependencies.glam]
requirement = "=0.33.12"
license = "MIT OR Apache-2.0"
purpose = "Checked right-handed WebGPU perspective views, clustered light bounds, cloud raster-history reprojection and rigid-body math in the water example"
target_cost = "Minimal std/f32 in the engine; the water example enables f64 for body integration. No optional integration dependencies"

[external_dependencies.winit]
requirement = "=0.30.13"
license = "Apache-2.0"
purpose = "Native iOS and Android window, touch and application event integration for the initial mobile game shell, plus the thrum-app macOS window shell that hosts the V1 surface diagnostic"
target_cost = "Target-specific platform glue and transitive closure; macOS surface callback and startup measured with the V1 scene, first iOS static-library compile measured separately, Android native build requires NDK and GameActivity packaging"

[external_dependencies.objc2]
requirement = "=0.6.5"
license = "MIT OR Apache-2.0"
purpose = "Narrow macOS AppKit display-link callback and per-view Objective-C bridge in the thrum-app window shell; the thrum-controls panel's target/action class; retained Metal protocol handles in the APPLE-TILE boundary fixture"
target_cost = "Apple-only; already transitive in the locked Metal closure; callback sends one event without frame work; renderer boundary fixture retains preparation-time pipeline handles"

[external_dependencies.objc2-foundation]
requirement = "=0.3.2"
license = "MIT OR Apache-2.0"
purpose = "Main-thread NSObject target and run-loop ownership for the thrum-app macOS view display link; NSString and geometry for the controls panel; Metal fixture shader source and preparation errors"
target_cost = "Apple-only framework binding; renderer use is pipeline preparation in the native boundary fixture, no per-frame string construction"

[external_dependencies.objc2-app-kit]
requirement = "=0.3.2"
license = "Zlib OR Apache-2.0 OR MIT"
purpose = "Native AppKit demo-control panel (NSPanel, NSStackView, NSSlider, NSButton, NSTextField) in thrum-controls and per-window screen queries in thrum-app"
target_cost = "macOS-only framework binding with default features off; the EDR window reads its screen each display tick"

[external_dependencies.objc2-quartz-core]
requirement = "=0.3.2"
license = "MIT OR Apache-2.0"
purpose = "CADisplayLink target timestamps and 120 Hz frame-rate range on the Mac display, owned by thrum-app"
target_cost = "macOS-only framework binding; Winit proxy traffic and callback allocations remain open G3b frame-thread measurements"

[external_dependencies.wgpu]
requirement = "=30.0.1"
license = "MIT OR Apache-2.0"
purpose = "Native mobile clear surface and typed GPU renderer with prepared synthetic scene, optional timestamp queries and portable WGSL"
target_cost = "Large target-specific graphics closure and device/surface memory; Metal/Vulkan/WebGPU feature sets and startup, GPU timestamps, surface recovery and sustained device costs require named-target measurement"

[external_dependencies.pollster]
requirement = "=1.0.1"
license = "Apache-2.0/MIT"
purpose = "Wait for native setup, test-device requests and validation scopes around surface configuration"
target_cost = "Small native/test dependency; surface configuration waits only on setup, resize or recovery"

[external_dependencies.blake3]
requirement = "=1.8.7"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
purpose = "G5 content addresses for cooked products, manifests, sources and cook actions; river file keys"
target_cost = "Runtime: one hash per HEAD/manifest name check and optional product verification; NEON/AVX2/AVX-512 selected internally. Cooker adds the rayon feature for multi-core hashing of large sources"

[external_dependencies.bytemuck]
requirement = "=1.25.2"
license = "Zlib OR Apache-2.0 OR MIT"
purpose = "Checked zero-copy casts between mapped G5 product bytes and repr(C) section element types; whole Pod host/WGSL records in the GPU sea and typed render uniform records"
target_cost = "Already transitive in the locked closure; derive macro at build time, no runtime cost beyond alignment/length checks once per product open or zero-copy byte views for sea and render uploads"

[external_dependencies.memmap2]
requirement = "=0.9.12"
license = "MIT OR Apache-2.0"
purpose = "Read-only memory mapping of immutable G5 content-addressed products on native targets"
target_cost = "Native-only; one mmap per product open, pages faulted on first touch during GPU upload; one narrow documented unsafe call"

[external_dependencies.meshopt]
requirement = "=0.7.0"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only meshoptimizer: vertex welding, cache/overdraw/fetch optimisation, meshlet building and meshlet culling bounds"
target_cost = "Compiles vendored meshoptimizer C++ for the cooker only; never in a shipping closure"

[external_dependencies.intel_tex_2]
requirement = "=0.5.0"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only ISPC BC7 texture and BC4 volume block compression"
target_cost = "Prebuilt ISPC kernels linked into the cooker only (macOS link prints a platform-load-command note); its ASTC entry point is unimplemented upstream and unused"

[external_dependencies.astcenc-rs]
requirement = "=0.2.0"
license = "Unlicense (bindings); vendored ARM astc-encoder is Apache-2.0"
purpose = "Authoring-only ASTC 4x4 texture compression with ARM's reference encoder"
target_cost = "Builds astc-encoder C++ and bindgen bindings (needs libclang) for the cooker only"

[external_dependencies.gltf]
requirement = "=1.4.1"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only glTF 2.0 and GLB import for the mesh cooker"
target_cost = "Cooker only; JSON and buffer import plus its image dependency"

[external_dependencies.image]
requirement = "=0.25.10"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only PNG/JPEG decode for the texture cooker, demo sources and cloud library import"
target_cost = "Cooker and V1 cloud library authoring tool and proof only"

[external_dependencies.notify]
requirement = "=8.2.1"
license = "CC0-1.0"
purpose = "Authoring-only filesystem watcher (FSEvents on macOS) that drives G5 cook cycles"
target_cost = "Cooker only; events are hints re-checked by the stat cache"

[external_dependencies.zstd]
requirement = "=0.13.3"
license = "MIT"
purpose = "Fast lossless capture intermediate using bounded two-worker compression of exact temporal XOR RGBA records"
target_cost = "macOS/iOS thrum-app opt-in capture writer only; native zstd code, two worker threads and bounded compression buffers; measured CPU and byte reduction, no world/render-thread compression"

[external_dependencies.sha2]
requirement = "=0.10.9"
license = "MIT OR Apache-2.0"
purpose = "Hash original RGBA records for independent decoder equality checks, check authored cloud sources, and derive the reference crowd rule-set identity at build time"
target_cost = "Capture hashes run on the macOS/iOS writer thread. Session proof and cloud library hashing run in host tools and tests"

[external_dependencies.cpu-time]
requirement = "=1.0.0"
license = "MIT OR Apache-2.0"
purpose = "Separate actual render-thread CPU consumption from callback wall time and scheduling waits during capture observer diagnosis"
target_cost = "macOS offscreen diagnostics: thread CPU clock observations per opportunity, no world-clock authority or GPU work"

[external_dependencies.cc]
requirement = "=1.10.0"
license = "MIT OR Apache-2.0"
purpose = "Compile the macOS qualification signpost bridge through public SDK macros for a same-process Instruments clock anchor"
target_cost = "Build dependency of thrum-app. One small C object on macOS only, using the existing locked compiler helper. Four signpost boundary calls per opt-in qualification run, no ordinary frame calls or GPU work."

[external_dependencies.objc2-metal]
requirement = "=0.3.2"
license = "MIT OR Apache-2.0 OR Zlib"
purpose = "Read generation Metal unified-memory facts and prepared texture storage modes, and prove the APPLE-TILE whole raw encoder boundary with native blits and a storage-writing kernel"
target_cost = "Apple-only binding already in locked wgpu Metal closure; preparation queries and an isolated native copy/select fixture with one blit and compute encoder, no rival queue"
[external_dependencies.half]
requirement = "=2.7.1"
license = "MIT OR Apache-2.0"
purpose = "Encode the registered Sun-path optical-depth field for portable filtered R16Float sampling"
target_cost = "Native and Wasm renderer setup or source replacement only, one conversion per field texel, no conversion on the fragment or per-frame metadata path"

[external_dependencies.harfrust]
requirement = "=0.16.0"
license = "MIT"
purpose = "Extract outline font kerning through OpenType shaping"
target_cost = "Authoring-only during font cooking"

[external_dependencies.skrifa]
requirement = "=0.50.0"
license = "MIT OR Apache-2.0"
purpose = "Read outline metrics and draw light-hinted glyph paths"
target_cost = "Authoring-only during font cooking"

[external_dependencies.zeno]
requirement = "=0.3.3"
license = "Apache-2.0 OR MIT"
purpose = "Rasterise glyph paths and their strokes to coverage masks"
target_cost = "Authoring-only during font cooking"

[external_dependencies.unicode-normalization]
requirement = "=0.1.26"
license = "(MIT OR Apache-2.0) AND Unicode-3.0"
purpose = "Build a font's canonical composition table"
target_cost = "Authoring-only during font cooking"
