# Register real packages and direct workspace dependencies here when introducing them.
# Module design responsibilities are not a prescription for one crate each.
[packages.thrum-core]
manifest = "crates/thrum-core/Cargo.toml"
allowed_workspace_dependencies = []

[packages.thrum-render]
manifest = "crates/thrum-render/Cargo.toml"
allowed_workspace_dependencies = []

[packages.thrum-mobile-shell]
manifest = "crates/thrum-mobile-shell/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core"]

[packages.thrum-network]
manifest = "crates/thrum-network/Cargo.toml"
# Test-only real W1 host integration; the production N1 codec remains independent.
allowed_workspace_dependencies = ["thrum-core"]

[packages.thrum-source]
manifest = "crates/thrum-source/Cargo.toml"
allowed_workspace_dependencies = []

[packages.thrum-cook]
manifest = "crates/thrum-cook/Cargo.toml"
allowed_workspace_dependencies = ["thrum-source"]

[packages.thrum-jobs]
manifest = "crates/thrum-jobs/Cargo.toml"
allowed_workspace_dependencies = ["thrum-source", "thrum-cook"]

[packages.xtask]
manifest = "tools/xtask/Cargo.toml"
allowed_workspace_dependencies = []

[packages.i1-mobile-game]
manifest = "examples/i1-mobile-game/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core", "thrum-mobile-shell", "thrum-source", "thrum-cook"]

[packages.v1-scene]
manifest = "examples/v1-scene/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core", "thrum-cook", "thrum-render", "thrum-source"]

# Every direct third-party crate must be listed here with an exact Cargo
# requirement, its declared license, purpose and target/build cost note.
# The check validates declarations; license/provenance review remains human work.
[external_dependencies]

[external_dependencies.rayon]
requirement = "=1.12.0"
license = "MIT OR Apache-2.0"
purpose = "Long-lived native V1 frame extraction worker pool over retained committed visual pages"
target_cost = "Native V1 scene only; one bounded extraction task and one worker initially, with dispatch, wake, allocation and overlap costs measured against the serial path; browser Wasm stays serial"

[external_dependencies.wasm-bindgen]
requirement = "=0.2.129"
license = "MIT OR Apache-2.0"
purpose = "Export the existing V1 frame host to a thin Chrome WebGPU page"
target_cost = "Browser V1 scene only; JS/Wasm boundary once per animation callback, with no duplicate simulation or render implementation"

[external_dependencies.wasm-bindgen-futures]
requirement = "=0.4.79"
license = "MIT OR Apache-2.0"
purpose = "Return asynchronous wgpu adapter, device and prepared-scene startup to the browser page"
target_cost = "Browser V1 scene startup only; no per-frame future allocation from this adapter"

[external_dependencies.web-sys]
requirement = "=0.3.106"
license = "MIT OR Apache-2.0"
purpose = "Pass the browser canvas to wgpu without a second window framework"
target_cost = "Browser V1 scene only with canvas and diagnostic console bindings; no DOM traversal or per-frame browser object retention"

[external_dependencies.web-time]
requirement = "=1.1.0"
license = "MIT OR Apache-2.0"
purpose = "Measure browser frame callback CPU stages with the Web Performance monotonic clock"
target_cost = "Browser V1 scene only; one monotonic clock read per measured stage, with native std::time retained"

[external_dependencies.divan]
requirement = "=0.1.21"
license = "MIT OR Apache-2.0"
purpose = "Deterministic V1 workload timing and allocation-count benchmarks for simulation, link conditioning and assembled GPU frames"
target_cost = "Development-only benchmark dependency; no runtime or target-device dependency, with benchmark compilation and timing overhead measured separately"

[external_dependencies.base64]
requirement = "=0.23.1"
license = "MIT OR Apache-2.0"
purpose = "Canonical RFC 4648 render texture source validation and fixed-slice decode without an F3 texel Vec"
target_cost = "Native thrum-source only; scalar no-default-features profile avoids dependency SIMD unsafe code while fixed-chunk throughput, F4 replay cost and accelerated alternative remain to measure"

[external_dependencies.hashbrown]
requirement = "=0.17.1"
license = "MIT OR Apache-2.0"
purpose = "Precharged, fixed-capacity confirmed replica object index with inspectable table allocation"
target_cost = "One pinned crate with no transitive dependencies in the selected feature set; measure native, Wasm and phone lookup, churn and rehash tails before qualification"

[external_dependencies.hecs]
requirement = "=0.11.2"
license = "MIT OR Apache-2.0"
purpose = "Private W1 typed component storage selected by the three-candidate V1 workload spike"
target_cost = "Three normal transitive crates in the selected profile; A1 measures checked-handle adaptation, serial and parallel queries, four-peer extraction, rollback and native/Wasm cost before qualification"

[external_dependencies.foldhash]
requirement = "=0.2.0"
license = "Zlib"
purpose = "Fast randomized stable-ID lookup for prior render samples during A2 extraction"
target_cost = "Already transitive through hecs; one direct dependency in thrum-render, two preallocated frame maps, measured at 10k visual instances"

[external_dependencies.glam]
requirement = "=0.33.12"
license = "MIT OR Apache-2.0"
purpose = "Checked right-handed WebGPU perspective view construction and per-view clustered light bounds for V1"
target_cost = "Minimal std/f32 profile with no optional integration dependencies; camera preparation cost and native, Wasm and iOS simulator compile checked separately"

[external_dependencies.winit]
requirement = "=0.30.13"
license = "Apache-2.0"
purpose = "Native iOS and Android window, touch and application event integration for the initial mobile game shell, plus the V1 macOS surface diagnostic"
target_cost = "Target-specific platform glue and transitive closure; macOS surface callback and startup measured with the V1 scene, first iOS static-library compile measured separately, Android native build requires NDK and GameActivity packaging"

[external_dependencies.wgpu]
requirement = "=30.0.1"
license = "MIT OR Apache-2.0"
purpose = "Native mobile clear surface and typed GPU renderer with prepared synthetic scene, optional timestamp queries and portable WGSL"
target_cost = "Large target-specific graphics closure and device/surface memory; Metal/Vulkan/WebGPU feature sets and startup, GPU timestamps, surface recovery and sustained device costs require named-target measurement"

[external_dependencies.pollster]
requirement = "=1.0.1"
license = "Apache-2.0/MIT"
purpose = "Block first mobile adapter/device creation in the initial shell and opt-in local renderer device tests"
target_cost = "Small native/test dependency; runtime startup blocking must be measured and replaced if it harms responsiveness"

[external_dependencies.serde]
requirement = "=1.0.229"
license = "MIT OR Apache-2.0"
purpose = "Strict bounded editable-source JSON decoding through DeserializeSeed"
target_cost = "Native tooling only; serde derive adds a build-time proc macro for strict render-object visitors, with no reflection or simulation runtime dependency; clean-build cost remains to measure"

[external_dependencies.fs4]
requirement = "=1.1.0"
license = "MIT OR Apache-2.0"
purpose = "Native available-space, allocation-granularity and cooperative lock probes for source staging, build-input materialization and the first T2 job owner"
target_cost = "Native source/cook/job tooling only; sync OS filesystem bindings, no game callback or portable core dependency"

[external_dependencies.rusqlite]
requirement = "=0.40.2"
license = "MIT"
purpose = "Native source blobs, manifests, root/outcome transactions and verified reader leases, including provisional snapshot qualification"
target_cost = "Native source tooling with a bundled SQLite C build and disk I/O; no portable core or game-callback dependency. A provisional root is not accepted-source or ready-build authority"

[external_dependencies.serde_json]
requirement = "=1.0.154"
license = "MIT OR Apache-2.0"
purpose = "Strict source and first-profile build-declaration JSON parsing, stable round-trip f64 semantics and exact optional-value carry-through in native tooling"
target_cost = "Native source/cook tooling only; float_roundtrip adds parser work and raw_value retains untouched source syntax, with bounded record memory separate from streaming scratch"

[external_dependencies.serde_json_canonicalizer]
requirement = "=0.4.1"
license = "MIT"
purpose = "Independent RFC 8785 JCS oracle for native source-manifest conformance tests"
target_cost = "Native tooling dev-dependency only; production manifest emission streams fixed-order fields without serializer allocation"

[external_dependencies.sha2]
requirement = "=0.11.1"
license = "MIT OR Apache-2.0"
purpose = "SHA-256 of exact source file bytes and canonical tree manifests"
target_cost = "Native source and cook tooling only; source-byte/product hashing scales with declared content and remains outside simulation callbacks"

[external_dependencies.unicase]
requirement = "=2.10.0"
license = "MIT OR Apache-2.0"
purpose = "Full Unicode case-fold collision detection for cross-target source paths"
target_cost = "Native tooling only; allocate folded metadata once per candidate path, not during simulation"

[external_dependencies.unicode-normalization]
requirement = "=0.1.26"
license = "MIT OR Apache-2.0"
purpose = "NFC validation of source paths before immutable capture"
target_cost = "Native tooling only; Unicode tables add binary/build cost and path checks occur once per candidate"
