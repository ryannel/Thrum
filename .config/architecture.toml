# Register real packages and direct workspace dependencies here when introducing them.
# Module design responsibilities are not a prescription for one crate each.
[boundaries]
external_game = "v1-game"
game_manifest = "examples/v1-game/Cargo.toml"

[packages.thrum-core]
manifest = "crates/thrum-core/Cargo.toml"
allowed_workspace_dependencies = []

[packages.thrum-content-runtime]
manifest = "crates/thrum-content-runtime/Cargo.toml"
allowed_workspace_dependencies = []

[packages.thrum-controls]
manifest = "crates/thrum-controls/Cargo.toml"
# G6 typed demo controls: one model, AppKit and DOM views; no game schema, no I/O.
allowed_workspace_dependencies = []

[packages.thrum-app]
manifest = "crates/thrum-app/Cargo.toml"
# G6 native macOS shell: window, Metal device recipe, display link, render owner, pause,
# device recovery, demo-control panel and frames report. G3b browser shell (`web`, wasm32
# only): WebGPU canvas surface and device, loss gating and replacement, page clock and frame
# step. Generic over a game's runtime; it names no game types and no content package. Its sky kit draws cooked meshes through
# thrum-asset-gpu (the engine's shipping residency path), so a creator's scene needs no
# status or store plumbing of its own.
allowed_workspace_dependencies = ["thrum-asset-gpu", "thrum-controls", "thrum-core", "thrum-render"]

[packages.thrum-asset]
manifest = "crates/thrum-asset/Cargo.toml"
# Runtime half of G5: shipping games read cooked products through this package only.
allowed_workspace_dependencies = []

[packages.thrum-asset-gpu]
manifest = "crates/thrum-asset-gpu/Cargo.toml"
# Shipping GPU residency for cooked products, drawn through thrum-render's scene-contribution seam.
allowed_workspace_dependencies = ["thrum-asset", "thrum-render"]

[packages.thrum-cook]
manifest = "crates/thrum-cook/Cargo.toml"
# Authoring-only G5 cooker; no shipping package may depend on it.
# Its only other edge is a dev-dependency on the asset-loop viewer for the edit-to-visible harness.
allowed_workspace_dependencies = ["thrum-asset", "asset-loop"]

[packages.asset-loop]
manifest = "examples/asset-loop/Cargo.toml"
# Shipping-shaped G5 viewer: maps cooked products; must never reach thrum-cook.
allowed_workspace_dependencies = ["thrum-asset", "thrum-render"]

[packages.thrum-render]
manifest = "crates/thrum-render/Cargo.toml"
allowed_workspace_dependencies = ["thrum-core"]

[packages.thrum-network]
manifest = "crates/thrum-network/Cargo.toml"
# The timed input window consumes the shared W1 InputFrame without owning gameplay truth.
allowed_workspace_dependencies = ["thrum-core"]

[packages.xtask]
manifest = "tools/xtask/Cargo.toml"
allowed_workspace_dependencies = []

[packages.v1-game]
manifest = "examples/v1-game/Cargo.toml"
# thrum-asset-gpu draws cooked products (a mapped store natively, a fetched generation on wasm32); thrum-cook is a dev-dependency
# only, for the in-game G5 tests and bench.
allowed_workspace_dependencies = ["thrum-app", "thrum-asset", "thrum-asset-gpu", "thrum-content-runtime", "thrum-controls", "thrum-cook", "thrum-core", "thrum-render"]
implicit_dependencies = { wasm-bindgen-futures = "async wasm_bindgen export expansion calls wasm_bindgen_futures" }

[packages.thrum-starter]
manifest = "examples/starter/Cargo.toml"
# G6 starter: the sky kit in thrum-app (which re-exports its controls and cooked-mesh types);
# no engine game types. `./dev starter` cooks and watches its assets with thrum-cook as a
# separate process, so it never depends on the authoring cooker.
allowed_workspace_dependencies = ["thrum-app"]

[packages.thrum-lighthouse]
manifest = "examples/lighthouse/Cargo.toml"
# G6 creator trial: the third fresh-agent scene (a lighthouse), kept compiling against the kit.
allowed_workspace_dependencies = ["thrum-app"]

[packages.thrum-stones]
manifest = "examples/stones/Cargo.toml"
# G6 creator trial: the first fresh-agent scene (a stone circle at dawn), ported to the kit.
allowed_workspace_dependencies = ["thrum-app"]

[packages.v1-game-ios]
manifest = "examples/v1-game-ios/Cargo.toml"
allowed_workspace_dependencies = ["v1-game", "thrum-render", "thrum-core", "thrum-asset-gpu", "thrum-app"]

# Every direct third-party crate must be listed here with an exact Cargo
# requirement, its declared license, purpose and target/build cost note.
# The check validates declarations; license/provenance review remains human work.
[external_dependencies]

[external_dependencies.serde]
requirement = "=1.0.229"
license = "MIT OR Apache-2.0"
purpose = "Typed game-authored showcase scene description, decoded once before activation"
target_cost = "Native game scene data only; derive-generated schema validation, no serialization in the tick or frame path"

[external_dependencies.serde_json]
requirement = "=1.0.154"
license = "MIT OR Apache-2.0"
purpose = "Decode the embedded authored scene recipe into checked camera and material placements"
target_cost = "One cold parse at scene activation; already in the authoring dependency graph, no per-frame parsing"

[external_dependencies.rayon]
requirement = "=1.12.0"
license = "MIT OR Apache-2.0"
purpose = "Native frame extraction and optional parallel registered simulation jobs"
target_cost = "Native-only worker pool; the V1 simulation measures serial/Rayon crossover and the browser stays serial. Core-class affinity is selected by the platform runtime rather than assumed by a tick"

[external_dependencies.wasm-bindgen]
requirement = "=0.2.129"
license = "MIT OR Apache-2.0"
purpose = "Export the existing V1 frame host to a thin Chrome WebGPU page; bind the global fetch for the G5 Wasm dev-server client"
target_cost = "Wasm only. V1: JS/Wasm boundary once per animation callback, with no duplicate simulation or render implementation. thrum-asset: two imported functions and one response type, crossed once per HEAD poll and per fetched product"

[external_dependencies.wasm-bindgen-futures]
requirement = "=0.4.79"
license = "MIT OR Apache-2.0"
purpose = "Support the async exported V1 browser game constructor generated by wasm-bindgen; the thrum-app web shell's detached device replacement; await fetch promises in the G5 Wasm dev-server client"
target_cost = "Wasm only. V1 and the web shell: startup and device replacement only, no per-frame use. thrum-asset: one promise bridge per HEAD poll and per fetched product, on the loader path, never the frame"

[external_dependencies.js-sys]
requirement = "=0.3.106"
license = "MIT OR Apache-2.0"
purpose = "Promise and Uint8Array bindings for the G5 Wasm dev-server client (already transitive through wasm-bindgen-futures)"
target_cost = "Wasm-only thrum-asset edge; one copy of each response body from the JS heap into 64-aligned Wasm memory, nothing per frame"

[external_dependencies.wasm-bindgen-test]
requirement = "=0.3.79"
license = "MIT OR Apache-2.0"
purpose = "Run the G5 Wasm dev-server client end to end under wasm-bindgen-test-runner against thrum-cook serve"
target_cost = "Wasm-only dev-dependency of thrum-asset; adds five small test-harness crates to the lockfile, nothing to any shipping build"

[external_dependencies.web-sys]
requirement = "=0.3.106"
license = "MIT OR Apache-2.0"
purpose = "Pass the browser canvas to wgpu without a second window framework"
target_cost = "Browser V1 scene and the thrum-app web shell only, with canvas and diagnostic console bindings; no DOM traversal or per-frame browser object retention"

[external_dependencies.web-time]
requirement = "=1.1.0"
license = "MIT OR Apache-2.0"
purpose = "Measure browser world, frame and cooked-asset stages with the Web Performance monotonic clock"
target_cost = "Wasm-only timing at measured stage boundaries. Native builds use std::time."

[external_dependencies.divan]
requirement = "=0.1.21"
license = "MIT OR Apache-2.0"
purpose = "Deterministic V1 workload timing and allocation-count benchmarks for simulation, link conditioning and assembled GPU frames"
target_cost = "Development-only benchmark dependency; no runtime or target-device dependency, with benchmark compilation and timing overhead measured separately"

[external_dependencies.smallvec]
requirement = "=1.16.4"
license = "MIT OR Apache-2.0"
purpose = "Inline storage for up to eight game actions per input frame without steady-tick heap allocation"
target_cost = "Already transitive in the locked workspace; one direct thrum-core dependency, 8-action inline payload; larger frames remain rejected by the V1 game configuration"

[external_dependencies.glam]
requirement = "=0.33.12"
license = "MIT OR Apache-2.0"
purpose = "Checked right-handed WebGPU perspective view construction and per-view clustered light bounds for V1"
target_cost = "Minimal std/f32 profile with no optional integration dependencies; camera preparation cost and native, Wasm and iOS simulator compile checked separately"

[external_dependencies.winit]
requirement = "=0.30.13"
license = "Apache-2.0"
purpose = "Native iOS and Android window, touch and application event integration for the initial mobile game shell, plus the thrum-app macOS window shell that hosts the V1 surface diagnostic"
target_cost = "Target-specific platform glue and transitive closure; macOS surface callback and startup measured with the V1 scene, first iOS static-library compile measured separately, Android native build requires NDK and GameActivity packaging"

[external_dependencies.objc2]
requirement = "=0.6.5"
license = "MIT OR Apache-2.0"
purpose = "Narrow macOS AppKit display-link callback and per-view Objective-C bridge in the thrum-app window shell; the thrum-controls panel's target/action class"
target_cost = "macOS-only; already transitive in the locked Metal closure; callback sends one event without frame work"

[external_dependencies.objc2-foundation]
requirement = "=0.3.2"
license = "MIT OR Apache-2.0"
purpose = "Main-thread NSObject target and run-loop ownership for the thrum-app macOS view display link; NSString and geometry for the controls panel"
target_cost = "macOS-only framework binding; no engine or iPhone runtime edge"

[external_dependencies.objc2-app-kit]
requirement = "=0.3.2"
license = "Zlib OR Apache-2.0 OR MIT"
purpose = "Native AppKit demo-control panel (NSPanel, NSStackView, NSSlider, NSButton, NSTextField) in thrum-controls"
target_cost = "macOS-only framework binding with default features off; built only on demand for the panel, no frame work, no iPhone or browser edge"

[external_dependencies.objc2-quartz-core]
requirement = "=0.3.2"
license = "MIT OR Apache-2.0"
purpose = "CADisplayLink target timestamps and 120 Hz frame-rate range on the Mac display, owned by thrum-app"
target_cost = "macOS-only framework binding; Winit proxy traffic and callback allocations remain open G3b frame-thread measurements"

[external_dependencies.wgpu]
requirement = "=30.0.1"
license = "MIT OR Apache-2.0"
purpose = "Native mobile clear surface and typed GPU renderer with prepared synthetic scene, optional timestamp queries and portable WGSL"
target_cost = "Large target-specific graphics closure and device/surface memory; Metal/Vulkan/WebGPU feature sets and startup, GPU timestamps, surface recovery and sustained device costs require named-target measurement"

[external_dependencies.pollster]
requirement = "=1.0.1"
license = "Apache-2.0/MIT"
purpose = "Block first mobile adapter/device creation in the initial shell and opt-in local renderer device tests"
target_cost = "Small native/test dependency; runtime startup blocking must be measured and replaced if it harms responsiveness"

[external_dependencies.blake3]
requirement = "=1.8.7"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
purpose = "G5 content addresses for cooked products, manifests, sources and cook actions"
target_cost = "Runtime: one hash per HEAD/manifest name check and optional product verification; NEON/AVX2/AVX-512 selected internally. Cooker adds the rayon feature for multi-core hashing of large sources"

[external_dependencies.bytemuck]
requirement = "=1.25.2"
license = "Zlib OR Apache-2.0 OR MIT"
purpose = "Checked zero-copy casts between mapped G5 product bytes and repr(C) section element types"
target_cost = "Already transitive in the locked closure; derive macro at build time, no runtime cost beyond alignment/length checks once per product open"

[external_dependencies.memmap2]
requirement = "=0.9.12"
license = "MIT OR Apache-2.0"
purpose = "Read-only memory mapping of immutable G5 content-addressed products on native targets"
target_cost = "Native-only; one mmap per product open, pages faulted on first touch during GPU upload; one narrow documented unsafe call"

[external_dependencies.meshopt]
requirement = "=0.7.0"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only meshoptimizer: vertex welding, cache/overdraw/fetch optimisation, meshlet building and meshlet culling bounds"
target_cost = "Compiles vendored meshoptimizer C++ for the cooker only; never in a shipping closure"

[external_dependencies.intel_tex_2]
requirement = "=0.5.0"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only ISPC BC7 texture and BC4 volume block compression"
target_cost = "Prebuilt ISPC kernels linked into the cooker only (macOS link prints a platform-load-command note); its ASTC entry point is unimplemented upstream and unused"

[external_dependencies.astcenc-rs]
requirement = "=0.2.0"
license = "Unlicense (bindings); vendored ARM astc-encoder is Apache-2.0"
purpose = "Authoring-only ASTC 4x4 texture compression with ARM's reference encoder"
target_cost = "Builds astc-encoder C++ and bindgen bindings (needs libclang) for the cooker only"

[external_dependencies.gltf]
requirement = "=1.4.1"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only glTF 2.0 and GLB import for the mesh cooker"
target_cost = "Cooker only; JSON and buffer import plus its image dependency"

[external_dependencies.image]
requirement = "=0.25.10"
license = "MIT OR Apache-2.0"
purpose = "Authoring-only PNG/JPEG decode for the texture cooker and demo sources"
target_cost = "Cooker only, PNG and JPEG codecs enabled"

[external_dependencies.notify]
requirement = "=8.2.1"
license = "CC0-1.0"
purpose = "Authoring-only filesystem watcher (FSEvents on macOS) that drives G5 cook cycles"
target_cost = "Cooker only; events are hints re-checked by the stat cache"

[external_dependencies.zstd]
requirement = "=0.13.3"
license = "MIT"
purpose = "Fast lossless capture intermediate using bounded two-worker compression of exact temporal XOR RGBA records"
target_cost = "macOS/iOS thrum-app opt-in capture writer only; native zstd code, two worker threads and bounded compression buffers; measured CPU and byte reduction, no world/render-thread compression"

[external_dependencies.sha2]
requirement = "=0.10.9"
license = "MIT OR Apache-2.0"
purpose = "Hash original RGBA records before live lossless encoding for independent decoder equality checks"
target_cost = "macOS/iOS capture writer thread only; ARM SHA-256 dispatch with portable fallback per full image and at most 1024 bounded digests per session"

[external_dependencies.cpu-time]
requirement = "=1.0.0"
license = "MIT OR Apache-2.0"
purpose = "Separate actual render-thread CPU consumption from callback wall time and scheduling waits during capture observer diagnosis"
target_cost = "macOS offscreen diagnostics: thread CPU clock observations per opportunity, no world-clock authority or GPU work"
