# The test runner's configuration for `./dev check`, which runs every test in a process of its
# own, side by side across every test binary (ORCHESTRATE.md, Test tiers; GATE-TIME mechanism 8).
# A package's test files are modules of one test target, `it` (GATE-TIME mechanism 10), so a filter
# selects a file's tests in it by their module, as `binary(=it) & test(/^<file>::/)`.
# A test relies on no other test of its binary having run and on no static it shares with one. A
# test that needs a device to itself joins a group below, and one that starts a thread pool is
# counted as heavy, in the landing that adds it.

# `./dev check` names the same version and stops before any step when an older one is installed.
nextest-version = { required = "0.9.150" }

[store]
# Relative to the workspace root, and the same whatever `CARGO_TARGET_DIR` says: `./dev check` reads
# the JUnit report from here (`NEXTEST_STORE` in `tools/xtask`, held equal by its test).
dir = "target/nextest"

[profile.default]
# Every test runs and reports. Nextest itself never retries a failed test.
fail-fast = false
retries = 0
# A test still running at ten seconds, the merge tier's bound for one test, is stopped. Because the
# check runs beside builders, `./dev check` runs each test it stopped once more, alone, after the
# others, under the same limit. Only the serial pass of `./dev check-all` uses the longer profile
# below. The rule `limit-exempt` refuses a default later than ten seconds.
slow-timeout = { period = "10s", terminate-after = 1 }
final-status-level = "slow"

[profile.default.junit]
# `./dev check` reads this report for its ten slowest tests and the tests it stopped.
path = "junit.xml"

[profile.workspace-rerun]
# Used only for the exact-case serial pass of `./dev check-all` (GATE-TIME mechanism 15).
slow-timeout = { period = "30s", terminate-after = 1 }

[test-groups]
# Each holds the tests of one file that keeps a device mutex for `cargo test`; they take turns
# with each other, beside every other test. The fifth such file, `thrum-render`'s
# `generation_transition/metal.rs`, is behind `creation-counters` and runs only in
# `./dev long-tests`, one binary at a time, where its mutex still holds.
cooked-assets = { max-threads = 1 }
frame-alloc = { max-threads = 1 }
foam-scene = { max-threads = 1 }
lens-scene = { max-threads = 1 }
water-interaction = { max-threads = 1 }
# Not a device mutex: the game's cooked-row and lent-product cases each draw a game host through
# edited cooked content and wait on the device every frame, so beyond two at once they only queue
# there and each runs past ten seconds (GATE-TIME M9).
game-cooked-content = { max-threads = 2 }

[[profile.default.overrides]]
# Full scene targets, some fixtures keeping two devices alive.
filter = 'package(v1-game) & binary(=cooked_assets_gpu)'
test-group = 'cooked-assets'

[[profile.default.overrides]]
# Counts the main thread's allocations over 600 frames of a Metal host.
filter = 'package(v1-game) & binary(=frame_alloc)'
test-group = 'frame-alloc'

[[profile.default.overrides]]
filter = 'package(v1-game) & binary(=it) & (test(/^cooked_rows_gpu::/) | test(/^lent_products_gpu::/))'
test-group = 'game-cooked-content'

[[profile.default.overrides]]
filter = 'package(water-scene) & binary(=foam_scene_gpu)'
test-group = 'foam-scene'

[[profile.default.overrides]]
# Paired lens measurements retain two hosts and their Metal timestamp sets.
filter = 'package(water-scene) & binary(=lens_gpu)'
test-group = 'lens-scene'

[[profile.default.overrides]]
# One live interaction fixture at a time: a Metal device and several full-grid buffers each.
filter = 'package(thrum-water) & (binary(=interaction_gpu) | (binary(=it) & test(/^(surf_)?foam_gpu::/)))'
test-group = 'water-interaction'

[[profile.default.overrides]]
# Every river solve starts a thread pool as wide as the machine.
filter = 'package(thrum-river-model)'
threads-required = 4

[[profile.default.overrides]]
# The forced mover route starts a Rayon pool to exercise multi-chunk rollback.
filter = 'package(=v1-game) & binary(=simulation) & test(=parallel_movers_match_the_straight_corrected_run_in_a_small_world)'
threads-required = 4

[[profile.default.overrides]]
# Sixteen threads poll the device for two seconds while this capture test runs.
filter = 'package(thrum-render) & test(gpu_capture_pixels_waits_for_a_readback_another_thread_delivers)'
threads-required = 4

[[profile.default.overrides]]
# Evaluate the island's shared whole-reach lattice and its CPU columns in bounded parallel jobs.
filter = 'package(water-scene) & test(=surf_cut::island_gale_coarse_to_fine_matches_the_whole_cut)'
threads-required = 8

# The exempt list: each test over ten seconds alone on the test build `./dev check` uses, as
# GATE-TIME M8 measured it. It is empty: GATE-TIME M2, M9 and M3 made each test fast or moved it to
# the main tier. No landing adds a name (the rule `limit-exempt`).
