baseline = '''
use thrum_core::profile::{Digest, Number, StateEncode};
pub struct Component(pub Number);
impl StateEncode for Component {
    fn encode(&self, digest: &mut Digest) { self.0.encode(digest); }
}
pub fn rule(value: Number) -> Number { value + Number::ONE }
'''

